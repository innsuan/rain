<!DOCTYPE html>
<meta charset="utf-8">
<title>雨 · fast</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #0a0e17;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
</style>
<canvas id="c"></canvas>
<script>
'use strict';

// ============================================================
//  ⚙  可调参数 — 所有能改画面和手感的东西都在这一块
//     TUNABLES — everything that changes look or feel lives here
// ============================================================

var CONFIG = {

  // ---- 像素格 · grid ----
  block: 4,          // 方块边长（CSS 像素）  block size in px
  gap: 8,            // 方块之间的缝隙        gap between blocks in px
  maxCells: 3400,    // 格子数上限，卡顿就调小 lower this if the phone stutters

  // ---- 颜色 · colour ----
  r: 91, g: 163, b: 181,   // 水色，默认 #5ba3b5
  bg: '#0a0e17',           // 背景色
  surfaceFade: 0,          // 0 = 颜色完全均匀；0.3-0.5 = 水面边缘柔化

  // ---- 光晕 · glow ----
  // 两层分别渲染、模糊，再按权重合成为一张（权重和恒为 1，不会截断、不偏色），
  // 最后以 glow 的强度叠加。glow < 1 保证光晕永远比方块暗。
  glow: 0.99,        // 光晕峰值亮度，占方块颜色的比例。必须 <= 1
                     //   0.9 以上时紧贴方块的一圈几乎与方块等亮
  glowBoost: 1.0,    // 整体提亮系数。相邻光晕用覆盖而非加法叠加，重叠处偏暗，
                     //   1.15-1.3 可以补回来
  haloMix: 0.8,      // 贴身光晕 vs 大范围辉光的配比。1 = 只要贴身的
  haloSpread: 1.2,   // 贴身光晕的直径，单位是「格」。1 = 刚好一格宽
  bloomSpread: 3.0,  // 弥散辉光的直径，单位是「格」。
                     //   ⚠ 精灵面积随它平方增长，是这个版本最大的开销来源：
                     //   1.5 -> 全屏 1.1 倍填充，3.0 -> 4.5 倍，4.0 -> 8 倍
  core: 0.2,         // 中心平台：半径的这个比例内保持满亮度，之后才开始衰减。
                     //   要让紧贴方块的一圈与方块同亮，core 需 >= (block/pitch)/haloSpread
  falloff: 2.75,     // 平台之外的衰减曲线。1 = 线性偏亮，3 = 尾巴长而淡

  // ---- 水量 · water ----
  // 雨量和水位是分开的：雨永远按 rainRate 下，水位靠排水自动调节，
  // 多了就多排、少了就少排，所以调 rainRate 只改雨的密度，不改水面高度。
  rainRate: 1,       // 每帧从顶部落下的雨滴数，可以是小数。
                     //   0.2 = 每 5 帧一颗（约每秒 12 颗），1 稀疏，4 中等，8 密集
  rainRateMax: 8,    // rainRate 的硬上限，写再大也不会超过
  rainMaxDrops: 700, // 空中同时存在的雨滴上限。满了就暂停生成，
                     //   这是防止「雨落得比排水快、水位涨到屏顶」的主要闸门
  waterLevel: 0.55,  // 水面高度，0 = 顶部，1 = 底部。初始水量和目标水量都由它决定
  drainSpeed: 0.12,  // 水位回到目标值的快慢。太大水面会一跳一跳
  drainBand: 3,      // 底部多少格内的水可以被排走。太窄会限制最大排水量
  maxParticles: 6000,

  // ---- 潮汐 · tide ----
  // 垂直于重力方向的正弦加速度。重力朝下时是左右摇，手机侧过来时会自动
  // 变成沿着新的水面方向摇。用的是力而不是直接位移，所以水会真的爬坡、
  // 回落、拍打边缘，而不是整块平移。
  tideAmplitude: 2,  // 摇晃力度，和 gravity 同单位。0 = 关闭。
                     //   gravity 的 20% 左右是很明显的晃动
  tidePeriod: 6.0,   // 一个完整来回的秒数。越小越急促。
                     //   注意水池本身有固有周期（当前设置下约 5 秒），设在附近
                     //   会共振、摆幅放大数倍；想要克制的晃动就避开它
  tideRainImmune: true,  // true = 下落中的雨滴不受潮汐影响

  // ---- 交互 · interaction ----
  // 重力只由陀螺仪决定。拖拽不改变重力，只在手指划过的瞬间推动水体。
  dragStrength: 26,  // 拖拽推水的力度
  dragRadius: 3.2,   // 拖拽影响的半径，单位是「格」
  dragMaxSpeed: 40,  // 单次拖拽能给出的最大速度，防止甩太狠
  rainImmune: true,  // true = 正在下落的雨滴不受拖拽影响
  rainDiscrete: true,// true = 下落中的雨滴各自独立：不互推、不进网格、不参与压力，
                     //   所以是一颗一颗分开的方块，落进水体的瞬间才并入流体
  rainSpread: 4,     // 生成时在上游方向铺开几格，避免一帧的雨排成一条线

  // ---- 性能 · performance ----
  // 物理时间跟着真实时间走，所以帧率低时水不会变成慢动作。
  // 帧率持续跟不上时自动降低求解精度和光晕层数，画质换流畅。
  showStats: false,  // true = 左上角显示帧率读数。也可以在网址后面加 ?fps=1 临时打开
  autoQuality: true, // false = 永远用满配，慢机器上就慢着
  targetFps: 52,     // 低于这个就开始降级，明显高于它才升回来
  minQuality: 0.35,  // 最多降到多少（0.35 大约是一半的求解量 + 单层光晕）

  // ---- 手感 · feel ----
  gravity: 20,       // 重力大小。手机竖直时的满值；越平躺越接近 0
  gravityFloor: 0.2, // 手机接近水平时保留的最小重力，占 gravity 的比例。
                     //   0 = 完全失重（水会飘着不动）
  flipRatio: 0.95,   // 0 = 粘稠如蜂蜜，0.97 = 活泼但会抖
  pressureIters: 25, // 越高水越不可压缩，越贵
  particleIters: 3,  // 粒子互推的迭代次数
  driftK: 1.0,       // 密度补偿强度，防止结块和空洞
};

// ---- 兜底：补齐缺失的键 ----
// 粘贴一份旧的 CONFIG 时，缺的键会是 undefined，一路算成 NaN 而且很难查。
// 这里用一份完整的默认值补齐，并把不认识的键报到控制台。
(function fillDefaults() {
  var D = {
    block: 4, gap: 8, maxCells: 3400,
    r: 91, g: 163, b: 181, bg: '#0a0e17', surfaceFade: 0,
    glow: 0.99, glowBoost: 1.0, haloMix: 0.8, haloSpread: 1.2, bloomSpread: 3.0,
    core: 0.2, falloff: 2.75,
    rainRate: 1, rainRateMax: 8, rainMaxDrops: 700,
    waterLevel: 0.55, drainSpeed: 0.12, drainBand: 3, maxParticles: 6000,
    tideAmplitude: 2, tidePeriod: 6.0, tideRainImmune: true,
    showStats: false, autoQuality: true, targetFps: 52, minQuality: 0.35,
    dragStrength: 26, dragRadius: 3.2, dragMaxSpeed: 40,
    rainImmune: true, rainDiscrete: true, rainSpread: 4,
    gravity: 20, gravityFloor: 0.2,
    flipRatio: 0.95, pressureIters: 25, particleIters: 3, driftK: 1.0
  };
  var missing = [], unknown = [];
  for (var k in D) if (CONFIG[k] === undefined) { CONFIG[k] = D[k]; missing.push(k); }
  for (var j in CONFIG) if (D[j] === undefined) unknown.push(j);
  if (missing.length) console.warn('CONFIG 缺少这些键，已用默认值补上:', missing.join(', '));
  if (unknown.length) console.warn('CONFIG 里有不认识的键，已忽略:', unknown.join(', '));
})();



// ============================================================
//  以下是实现，一般不需要改
//  Implementation below — you shouldn't need to touch it
// ============================================================

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var BLOCK = CONFIG.block, GAP = CONFIG.gap;
var W, H, PITCH = BLOCK + GAP;
var cellW, cellH, blockW, blockH, dpr = 1;

// ============================================================
// FLIP fluid — following the step order in lib.rs:
//   integrate -> pushApart -> collide -> pushApart -> collide
//   -> transferToGrid -> updateParticleDensity
//   -> solveIncompressibility -> extrapolate -> transferToParticles
// ============================================================

// --- grid ---
var h = 1.0;                 // cell size (sim units)
var simW, simH, numCells;
var u, v, prevU, prevV, wU, wV, s, cellType, particleDensity;
var FLUID = 0, AIR = 1, SOLID = 2;

// --- solver params ---
var dt = 1 / 60;            // rewritten every frame from the real clock
var numPressureIters = CONFIG.pressureIters;
var numParticleIters = CONFIG.particleIters;
var overRelax = 1.9;
var flipRatio = CONFIG.flipRatio;
var compensateDrift = true;
var driftK = CONFIG.driftK;

// --- particles ---
var maxP = CONFIG.maxParticles;
var nP = 0;
var px = new Float32Array(maxP);
var py = new Float32Array(maxP);
var pvx = new Float32Array(maxP);
var pvy = new Float32Array(maxP);
// 0 = part of the body, 1 = still falling as rain (exempt from drag)
var pTag = new Uint8Array(maxP);

// particle radius is now tied to the seeding spacing (lib.rs: r = 0.3*h, dx = 2r)
var pRadius = 0.3 * h;
var minDist = 2.0 * pRadius;
var pInvSpacing = 1.0 / (2.2 * pRadius);
var pNumX, pNumY, pNumCells;
var numCellParticles, firstCellParticle, cellParticleIds;

// rest density is measured once, on the first frame, from the seeded state
var particleRestDensity = 0.0;
var targetP = 0;   // body size the drain regulates towards

// safety clamp only — with the prevU fix this should almost never fire
var MAX_SPEED = 20.0;

function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }

function resize() {
  W = window.innerWidth; H = window.innerHeight;

  // Back the canvas with real device pixels so blocks aren't blurry on phones,
  // and pin the CSS size to the same numbers we drew with, so nothing stretches.
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The sim grid IS the display grid — one simulation cell draws one block.
  // That way every interior cell holds ~restDensity particles and can never
  // come out empty, which is what produced the black speckles.
  simW = Math.max(12, Math.round(W / PITCH));
  simH = Math.max(12, Math.round(H / PITCH));

  // Cap total cells so slower phones keep 60fps; the grid coarsens (blocks and
  // gaps both grow proportionally) rather than dropping frames.
  var MAX_CELLS = CONFIG.maxCells;
  while (simW * simH > MAX_CELLS) {
    simW = Math.max(12, Math.round(simW * 0.94));
    simH = Math.max(12, Math.round(simH * 0.94));
  }

  cellW = W / simW;
  cellH = H / simH;
  blockW = cellW * (BLOCK / PITCH);
  blockH = cellH * (BLOCK / PITCH);

  buildComboSprite();

  initSimBuffers();
}

function initSimBuffers() {
  numCells = simW * simH;
  u = new Float32Array(numCells);
  v = new Float32Array(numCells);
  prevU = new Float32Array(numCells);
  prevV = new Float32Array(numCells);
  wU = new Float32Array(numCells);
  wV = new Float32Array(numCells);
  s = new Float32Array(numCells);
  cellType = new Int32Array(numCells);
  particleDensity = new Float32Array(numCells);

  for (var i = 0; i < simW; i++)
    for (var j = 0; j < simH; j++)
      s[i + j * simW] = (i === 0 || i === simW - 1 || j === 0 || j === simH - 1) ? 0 : 1;

  // counting-sort acceleration grid for pushApart (lib.rs style, zero alloc per frame)
  pNumX = Math.floor(simW * pInvSpacing) + 1;
  pNumY = Math.floor(simH * pInvSpacing) + 1;
  pNumCells = pNumX * pNumY;
  numCellParticles = new Int32Array(pNumCells);
  firstCellParticle = new Int32Array(pNumCells + 1);
  cellParticleIds = new Int32Array(maxP);

  particleRestDensity = 0.0;
  seed();
}

// seed on a staggered lattice with dx = 2r, dy = sqrt(3)/2*dx — this is what
// makes the measured rest density consistent with minDist
function seed() {
  nP = 0;
  var dx = 2.0 * pRadius;
  var dy = Math.sqrt(3.0) / 2.0 * dx;
  var minX = 1.0 + pRadius, maxX = (simW - 1) - pRadius;
  var minY = 1.0 + pRadius, maxY = (simH - 1) - pRadius;
  var startY = minY + (maxY - minY) * CONFIG.waterLevel;

  var row = 0;
  for (var y = startY; y <= maxY; y += dy, row++) {
    for (var x = minX + (row % 2 ? pRadius : 0); x <= maxX; x += dx) {
      if (nP >= maxP - 200) return;   // headroom for touch-added drops
      px[nP] = x; py[nP] = y;
      pvx[nP] = 0; pvy[nP] = 0;
      pTag[nP] = 0;
      nP++;
    }
  }
  // the pool we just laid down IS the target volume the drain aims to hold
  targetP = nP;
}

var gx = 0, gy = CONFIG.gravity;

// ---- 1. integrate ----
var simTime = 0;
var tideX = 0, tideY = 0;

// Sinusoidal acceleration at right angles to gravity, so the sway always runs
// along the water's surface no matter how the phone is held.
function updateTide(sdt) {
  simTime += sdt;
  var amp = CONFIG.tideAmplitude;
  if (amp <= 0 || CONFIG.tidePeriod <= 0) { tideX = tideY = 0; return; }

  var gLen = Math.sqrt(gx * gx + gy * gy);
  var ux, uy;
  if (gLen < 1e-4) { ux = 1; uy = 0; }        // no gravity: fall back to horizontal
  else { ux = -gy / gLen; uy = gx / gLen; }   // rotate gravity 90 degrees

  var a = Math.sin(simTime * 2 * Math.PI / CONFIG.tidePeriod) * amp;
  tideX = ux * a;
  tideY = uy * a;
}

function integrateParticles(sdt) {
  var rainSkipsTide = CONFIG.tideRainImmune;
  for (var i = 0; i < nP; i++) {
    var ax = gx, ay = gy;
    if (!(rainSkipsTide && pTag[i] === 1)) { ax += tideX; ay += tideY; }
    pvx[i] += sdt * ax;
    pvy[i] += sdt * ay;
    px[i] += pvx[i] * sdt;
    py[i] += pvy[i] * sdt;
  }
}

// ---- 2. push apart (counting sort, no per-frame allocation) ----
function pushParticlesApart(numIters) {
  numCellParticles.fill(0);

  var i, xi, yi, cellNr;
  for (i = 0; i < nP; i++) {
    xi = clamp(Math.floor(px[i] * pInvSpacing), 0, pNumX - 1);
    yi = clamp(Math.floor(py[i] * pInvSpacing), 0, pNumY - 1);
    numCellParticles[xi * pNumY + yi]++;
  }

  var first = 0;
  for (i = 0; i < pNumCells; i++) {
    first += numCellParticles[i];
    firstCellParticle[i] = first;
  }
  firstCellParticle[pNumCells] = first;

  for (i = 0; i < nP; i++) {
    xi = clamp(Math.floor(px[i] * pInvSpacing), 0, pNumX - 1);
    yi = clamp(Math.floor(py[i] * pInvSpacing), 0, pNumY - 1);
    cellNr = xi * pNumY + yi;
    firstCellParticle[cellNr]--;
    cellParticleIds[firstCellParticle[cellNr]] = i;
  }

  var minDist2 = minDist * minDist;

  for (var iter = 0; iter < numIters; iter++) {
    for (i = 0; i < nP; i++) {
      var qx0 = px[i], qy0 = py[i];
      var pxi = Math.floor(qx0 * pInvSpacing);
      var pyi = Math.floor(qy0 * pInvSpacing);
      var x0 = Math.max(pxi - 1, 0), y0 = Math.max(pyi - 1, 0);
      var x1 = Math.min(pxi + 1, pNumX - 1), y1 = Math.min(pyi + 1, pNumY - 1);

      for (xi = x0; xi <= x1; xi++) {
        for (yi = y0; yi <= y1; yi++) {
          cellNr = xi * pNumY + yi;
          var f = firstCellParticle[cellNr], l = firstCellParticle[cellNr + 1];
          for (var k = f; k < l; k++) {
            var id = cellParticleIds[k];
            if (id === i) continue;
            // a falling drop neither pushes nor is pushed — that is what keeps
            // the rain from clumping into streaks on the way down
            if (CONFIG.rainDiscrete && (pTag[i] === 1 || pTag[id] === 1)) continue;
            var dx = px[id] - px[i], dy = py[id] - py[i];
            var d2 = dx * dx + dy * dy;
            if (d2 > minDist2 || d2 === 0.0) continue;
            var d = Math.sqrt(d2);
            var sc = 0.5 * (minDist - d) / d;
            dx *= sc; dy *= sc;
            px[i] -= dx; py[i] -= dy;
            px[id] += dx; py[id] += dy;
          }
        }
      }
    }
  }
}

// ---- 3. wall collisions (now its own pass, run after pushApart) ----
function handleParticleCollisions() {
  var minX = h + pRadius, maxX = (simW - 1) * h - pRadius;
  var minY = h + pRadius, maxY = (simH - 1) * h - pRadius;
  for (var i = 0; i < nP; i++) {
    if (px[i] < minX) { px[i] = minX; pvx[i] = 0; }
    else if (px[i] > maxX) { px[i] = maxX; pvx[i] = 0; }
    if (py[i] < minY) { py[i] = minY; pvy[i] = 0; }
    else if (py[i] > maxY) { py[i] = maxY; pvy[i] = 0; }
  }
}

// ---- 4. particles -> grid ----
// u lives on the left face of a cell  -> sampled at (i,     j+0.5)
// v lives on the bottom face of a cell -> sampled at (i+0.5, j)
function transferToGrid() {
  u.fill(0); v.fill(0); wU.fill(0); wV.fill(0);

  var i;
  for (i = 0; i < numCells; i++)
    cellType[i] = (s[i] === 0.0) ? SOLID : AIR;

  for (i = 0; i < nP; i++) {
    if (CONFIG.rainDiscrete && pTag[i] === 1) continue;   // a drop in flight is not fluid yet
    var ci = clamp(Math.floor(px[i]), 0, simW - 1);
    var cj = clamp(Math.floor(py[i]), 0, simH - 1);
    var idx = ci + cj * simW;
    if (cellType[idx] === AIR) cellType[idx] = FLUID;
  }

  for (var p = 0; p < nP; p++) {
    // u component
    var x = px[p], y = py[p] - 0.5;
    var i0 = clamp(Math.floor(x), 0, simW - 2), j0 = clamp(Math.floor(y), 0, simH - 2);
    var fx = clamp(x - i0, 0, 1), fy = clamp(y - j0, 0, 1);
    var w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
    var a = i0 + j0 * simW, b = a + 1, c = a + simW, d = c + 1;
    u[a] += w00 * pvx[p]; wU[a] += w00;
    u[b] += w10 * pvx[p]; wU[b] += w10;
    u[c] += w01 * pvx[p]; wU[c] += w01;
    u[d] += w11 * pvx[p]; wU[d] += w11;

    // v component
    x = px[p] - 0.5; y = py[p];
    i0 = clamp(Math.floor(x), 0, simW - 2); j0 = clamp(Math.floor(y), 0, simH - 2);
    fx = clamp(x - i0, 0, 1); fy = clamp(y - j0, 0, 1);
    w00 = (1 - fx) * (1 - fy); w10 = fx * (1 - fy); w01 = (1 - fx) * fy; w11 = fx * fy;
    a = i0 + j0 * simW; b = a + 1; c = a + simW; d = c + 1;
    v[a] += w00 * pvy[p]; wV[a] += w00;
    v[b] += w10 * pvy[p]; wV[b] += w10;
    v[c] += w01 * pvy[p]; wV[c] += w01;
    v[d] += w11 * pvy[p]; wV[d] += w11;
  }

  for (i = 0; i < numCells; i++) {
    if (wU[i] > 0) u[i] /= wU[i];
    if (wV[i] > 0) v[i] /= wV[i];
  }

  // enforce solid boundary velocities
  for (var ii = 0; ii < simW; ii++) {
    for (var jj = 0; jj < simH; jj++) {
      var k = ii + jj * simW;
      var isSolid = cellType[k] === SOLID;
      if (isSolid || (ii > 0 && cellType[k - 1] === SOLID)) u[k] = 0;
      if (isSolid || (jj > 0 && cellType[k - simW] === SOLID)) v[k] = 0;
    }
  }
}

// ---- 5. particle density (this is what was missing) ----
function updateParticleDensity() {
  particleDensity.fill(0);
  var h2 = 0.5 * h;

  for (var p = 0; p < nP; p++) {
    // drops in flight must not contribute density, or a cluster of them would
    // read as "body" and retire each other in mid-air
    if (CONFIG.rainDiscrete && pTag[p] === 1) continue;
    var x = clamp(px[p], h, (simW - 1) * h);
    var y = clamp(py[p], h, (simH - 1) * h);

    var x0 = Math.floor((x - h2) / h);
    var tx = ((x - h2) - x0 * h) / h;
    var x1 = Math.min(x0 + 1, simW - 2);
    var y0 = Math.floor((y - h2) / h);
    var ty = ((y - h2) - y0 * h) / h;
    var y1 = Math.min(y0 + 1, simH - 2);

    var sx = 1.0 - tx, sy = 1.0 - ty;
    if (x0 < simW && y0 < simH) particleDensity[x0 + y0 * simW] += sx * sy;
    if (x1 < simW && y0 < simH) particleDensity[x1 + y0 * simW] += tx * sy;
    if (x1 < simW && y1 < simH) particleDensity[x1 + y1 * simW] += tx * ty;
    if (x0 < simW && y1 < simH) particleDensity[x0 + y1 * simW] += sx * ty;
  }

  // measure the rest density once, from the initial (well-packed) state
  if (particleRestDensity === 0.0) {
    var sum = 0, n = 0;
    for (var i = 0; i < numCells; i++) {
      if (cellType[i] === FLUID) { sum += particleDensity[i]; n++; }
    }
    if (n > 0) particleRestDensity = sum / n;
  }
}

// ---- 6. pressure solve ----
// prevU/prevV are snapshotted HERE — the FLIP delta must be
// (after pressure) - (after transfer), within the same frame.
// A rain drop stops counting as rain once it lands in a cell that is already
// carrying roughly body density — at that point it is part of the water and
// should respond to drags like everything else.
function retireLandedRain() {
  if (particleRestDensity <= 0) return;
  var thresh = particleRestDensity * 0.35;
  for (var i = 0; i < nP; i++) {
    if (pTag[i] === 0) continue;
    var ci = px[i] | 0, cj = py[i] | 0;
    if (ci < 0 || ci >= simW || cj < 0 || cj >= simH) continue;
    var idx = ci + cj * simW;

    // joins the body when it lands in water, touches the surface from above,
    // or reaches the floor — without the last two a discrete drop would fall
    // straight through the pool and pile up at the bottom
    var landed =
      particleDensity[idx] >= thresh ||
      cellType[idx] === FLUID ||
      (cj + 1 < simH && cellType[idx + simW] === FLUID) ||
      py[i] > simH - 2.2;

    if (landed) pTag[i] = 0;
  }
}

function solveIncompressibility() {
  prevU.set(u); prevV.set(v);

  for (var iter = 0; iter < numPressureIters; iter++) {
    for (var i = 1; i < simW - 1; i++) {
      for (var j = 1; j < simH - 1; j++) {
        var center = i + j * simW;
        if (cellType[center] !== FLUID) continue;

        var left = center - 1, right = center + 1;
        var bottom = center - simW, top = center + simW;

        var sx0 = s[left], sx1 = s[right], sy0 = s[bottom], sy1 = s[top];
        var sSum = sx0 + sx1 + sy0 + sy1;
        if (sSum === 0.0) continue;

        var div = u[right] - u[center] + v[top] - v[center];

        if (particleRestDensity > 0.0 && compensateDrift) {
          var compression = particleDensity[center] - particleRestDensity;
          if (compression > 0.0) div -= driftK * compression;
        }

        var p = -div / sSum * overRelax;

        u[center] -= sx0 * p;
        u[right]  += sx1 * p;
        v[center] -= sy0 * p;
        v[top]    += sy1 * p;
      }
    }
  }
}

// ---- 7. extrapolate into air, AFTER the solve ----
// u and prevU are filled from the SAME neighbour set so the FLIP delta
// stays meaningful at the free surface.
function extrapolateVelocities() {
  for (var pass = 0; pass < 2; pass++) {
    for (var i = 1; i < simW - 1; i++) {
      for (var j = 1; j < simH - 1; j++) {
        var idx = i + j * simW;
        if (cellType[idx] === SOLID) continue;

        if (wU[idx] === 0) {
          var su = 0, sp = 0, cnt = 0;
          if (wU[idx - 1] > 0)    { su += u[idx - 1];    sp += prevU[idx - 1];    cnt++; }
          if (wU[idx + 1] > 0)    { su += u[idx + 1];    sp += prevU[idx + 1];    cnt++; }
          if (wU[idx - simW] > 0) { su += u[idx - simW]; sp += prevU[idx - simW]; cnt++; }
          if (wU[idx + simW] > 0) { su += u[idx + simW]; sp += prevU[idx + simW]; cnt++; }
          if (cnt > 0) { u[idx] = su / cnt; prevU[idx] = sp / cnt; wU[idx] = 1; }
        }
        if (wV[idx] === 0) {
          var sv = 0, sq = 0, cnt2 = 0;
          if (wV[idx - 1] > 0)    { sv += v[idx - 1];    sq += prevV[idx - 1];    cnt2++; }
          if (wV[idx + 1] > 0)    { sv += v[idx + 1];    sq += prevV[idx + 1];    cnt2++; }
          if (wV[idx - simW] > 0) { sv += v[idx - simW]; sq += prevV[idx - simW]; cnt2++; }
          if (wV[idx + simW] > 0) { sv += v[idx + simW]; sq += prevV[idx + simW]; cnt2++; }
          if (cnt2 > 0) { v[idx] = sv / cnt2; prevV[idx] = sq / cnt2; wV[idx] = 1; }
        }
      }
    }
  }
}

// ---- 8. grid -> particles ----
function transferToParticles() {
  var maxSp2 = MAX_SPEED * MAX_SPEED;

  for (var p = 0; p < nP; p++) {
    if (CONFIG.rainDiscrete && pTag[p] === 1) continue;   // free fall, no grid feedback
    var x = px[p], y = py[p] - 0.5;
    var i0 = clamp(Math.floor(x), 0, simW - 2), j0 = clamp(Math.floor(y), 0, simH - 2);
    var fx = clamp(x - i0, 0, 1), fy = clamp(y - j0, 0, 1);
    var w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
    var a = i0 + j0 * simW, b = a + 1, c = a + simW, d = c + 1;

    var picU  = w00 * u[a]     + w10 * u[b]     + w01 * u[c]     + w11 * u[d];
    var oldU  = w00 * prevU[a] + w10 * prevU[b] + w01 * prevU[c] + w11 * prevU[d];
    pvx[p] = flipRatio * (pvx[p] + (picU - oldU)) + (1 - flipRatio) * picU;

    x = px[p] - 0.5; y = py[p];
    i0 = clamp(Math.floor(x), 0, simW - 2); j0 = clamp(Math.floor(y), 0, simH - 2);
    fx = clamp(x - i0, 0, 1); fy = clamp(y - j0, 0, 1);
    w00 = (1 - fx) * (1 - fy); w10 = fx * (1 - fy); w01 = (1 - fx) * fy; w11 = fx * fy;
    a = i0 + j0 * simW; b = a + 1; c = a + simW; d = c + 1;

    var picV  = w00 * v[a]     + w10 * v[b]     + w01 * v[c]     + w11 * v[d];
    var oldV  = w00 * prevV[a] + w10 * prevV[b] + w01 * prevV[c] + w11 * prevV[d];
    pvy[p] = flipRatio * (pvy[p] + (picV - oldV)) + (1 - flipRatio) * picV;

    var sp2 = pvx[p] * pvx[p] + pvy[p] * pvy[p];
    if (sp2 > maxSp2) {
      var sc = MAX_SPEED / Math.sqrt(sp2);
      pvx[p] *= sc; pvy[p] *= sc;
    }
  }
}

function simulate() {
  updateTide(dt);
  integrateParticles(dt);
  pushParticlesApart(numParticleIters);
  handleParticleCollisions();
  pushParticlesApart(numParticleIters);
  handleParticleCollisions();
  transferToGrid();
  updateParticleDensity();
  retireLandedRain();
  solveIncompressibility();
  extrapolateVelocities();
  transferToParticles();
}

// ---- Gyroscope ----
// beta/gamma are Euler angles, not screen-space components. Rebuild the actual
// gravity vector from the rotation matrix, then rotate it by the screen's own
// orientation angle — skipping that second step is what made gravity point
// along a diagonal once the phone was turned sideways.

var gyroActive = false, gyroLive = false;

function screenAngle() {
  if (screen && screen.orientation && typeof screen.orientation.angle === 'number')
    return screen.orientation.angle;
  return window.orientation || 0;   // older iOS
}

function handleOri(e) {
  if (e.beta === null && e.gamma === null) return;
  gyroLive = true;

  var beta = (e.beta || 0) * Math.PI / 180;    // front-back tilt
  var gamma = (e.gamma || 0) * Math.PI / 180;  // left-right tilt

  // Gravity in the device's own frame, from the ZXY rotation matrix.
  // Third row of R gives the vertical axis; the in-plane part is what we need.
  var dx = Math.cos(beta) * Math.sin(gamma);   // device X (right)
  var dy = Math.sin(beta);                     // device Y, already flipped to screen-down

  // Now rotate into the *displayed* orientation.
  var th = screenAngle() * Math.PI / 180;
  var ct = Math.cos(th), st = Math.sin(th);
  var sx = dx * ct + dy * st;
  var sy = -dx * st + dy * ct;

  // dx,dy are direction cosines, so their length is the sine of the tilt away
  // from flat: standing upright gives 1, lying on a table gives 0.
  var len = Math.sqrt(sx * sx + sy * sy);
  var floor = CONFIG.gravityFloor;

  if (len < 1e-3) {
    // dead flat and no meaningful direction — keep whatever we had, just weak
    var pl = Math.sqrt(gx * gx + gy * gy) || 1;
    gx = gx / pl * CONFIG.gravity * floor;
    gy = gy / pl * CONFIG.gravity * floor;
    return;
  }

  var mag = Math.max(len, floor) * CONFIG.gravity;
  gx = sx / len * mag;
  gy = sy / len * mag;
}

// No button: the first touch anywhere doubles as the permission gesture.
function activateGyro() {
  if (gyroActive) return;
  gyroActive = true;

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(function (st) {
      if (st === 'granted') window.addEventListener('deviceorientation', handleOri);
    }).catch(function () {});
  } else {
    window.addEventListener('deviceorientation', handleOri);
  }
}

// re-evaluate on rotation so the axis snaps immediately, not on the next tilt
window.addEventListener('orientationchange', function () {
  if (screen && screen.orientation) return;   // modern path updates on its own
});

// ---- Touch/mouse → momentary impulse on the water ----
// Gravity belongs to the gyroscope alone. A drag no longer tilts the world; it
// shoves the water it passes through, and only while the finger is moving.

var pointerDown = false;
var lastPX = 0, lastPY = 0, hasLast = false;

function stir(sx, sy, dxPx, dyPx) {
  var len = Math.sqrt(dxPx * dxPx + dyPx * dyPx);
  if (len < 0.5) return;                     // a still finger does nothing

  // screen px -> sim cells, and per-frame delta -> velocity
  var cx = sx / W * simW, cy = sy / H * simH;
  var dirX = dxPx / len, dirY = dyPx / len;

  var speed = Math.min(len / cellW * CONFIG.dragStrength * 0.1, CONFIG.dragMaxSpeed);
  var rad = CONFIG.dragRadius, rad2 = rad * rad;

  for (var i = 0; i < nP; i++) {
    if (CONFIG.rainImmune && pTag[i] === 1) continue;   // let the rain fall through
    var ddx = px[i] - cx, ddy = py[i] - cy;
    var d2 = ddx * ddx + ddy * ddy;
    if (d2 > rad2) continue;
    var f = (1 - Math.sqrt(d2) / rad);        // linear falloff from the finger
    pvx[i] += dirX * speed * f;
    pvy[i] += dirY * speed * f;
  }
}

function pointerStart(sx, sy) {
  pointerDown = true;
  lastPX = sx; lastPY = sy; hasLast = true;
}
function pointerMove(sx, sy) {
  if (!pointerDown || !hasLast) return;
  stir(sx, sy, sx - lastPX, sy - lastPY);
  lastPX = sx; lastPY = sy;
}
function pointerEnd() {
  pointerDown = false; hasLast = false;
}

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  activateGyro();                       // first touch is the permission gesture
  pointerStart(e.touches[0].clientX, e.touches[0].clientY);
});
canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  // every finger stirs; the first one also drives lastPX/lastPY
  for (var i = 1; i < e.touches.length; i++) {
    stir(e.touches[i].clientX, e.touches[i].clientY, e.touches[i].clientX - lastPX, e.touches[i].clientY - lastPY);
  }
  pointerMove(e.touches[0].clientX, e.touches[0].clientY);
});
canvas.addEventListener('touchend', function (e) { e.preventDefault(); pointerEnd(); });
canvas.addEventListener('touchcancel', function () { pointerEnd(); });

canvas.addEventListener('mousedown', function (e) { activateGyro(); pointerStart(e.clientX, e.clientY); });
canvas.addEventListener('mousemove', function (e) { pointerMove(e.clientX, e.clientY); });
canvas.addEventListener('mouseup', pointerEnd);
canvas.addEventListener('mouseleave', pointerEnd);

// ---- Weather & appearance (controllable) ----
var weather = {
  rainRate: CONFIG.rainRate,
};

var appearance = {
  r: CONFIG.r, g: CONFIG.g, b: CONFIG.b,
  surfaceFade: CONFIG.surfaceFade,
  glow: CONFIG.glow,
  haloMix: CONFIG.haloMix,
  haloSpread: CONFIG.haloSpread,
  bloomSpread: CONFIG.bloomSpread,
  core: CONFIG.core,
  falloff: CONFIG.falloff,
  glowBoost: CONFIG.glowBoost,
};

var maxWater = maxP - 200;  // leave headroom

var nRain = 0;        // drops currently in flight
var rainCarry = 0;    // fractional leftover, so rainRate can be 0.2

// Rain enters from the upwind edge — the side gravity is pulling away from —
// along the line perpendicular to gravity, so turning the phone moves where
// the rain comes from instead of leaving it stuck to one edge of the screen.
function spawnRainDrop(slot) {
  var lo = 1.2, hiX = simW - 1.2, hiY = simH - 1.2;

  var gLen = Math.sqrt(gx * gx + gy * gy);
  var ux, uy;
  if (gLen < 1e-4) { ux = 0; uy = 1; }
  else { ux = gx / gLen; uy = gy / gLen; }     // unit "down"
  var qx = -uy, qy = ux;                       // unit "along the surface"

  var cx = (lo + hiX) * 0.5, cy = (lo + hiY) * 0.5;

  // how far upwind the box reaches, measured along gravity from the centre
  var sMin = Infinity;
  var xs = [lo, hiX], ys = [lo, hiY];
  for (var a = 0; a < 2; a++) {
    for (var b = 0; b < 2; b++) {
      var d = (xs[a] - cx) * ux + (ys[b] - cy) * uy;
      if (d < sMin) sMin = d;
    }
  }

  var sp = sMin + 0.6 + Math.random() * CONFIG.rainSpread;
  var bx = cx + ux * sp, by = cy + uy * sp;

  // clip the spawn line to the box to find the valid span along q
  var t0 = -1e9, t1 = 1e9;
  if (Math.abs(qx) < 1e-6) { if (bx < lo || bx > hiX) return false; }
  else {
    var a0 = (lo - bx) / qx, a1 = (hiX - bx) / qx;
    if (a0 > a1) { var tmp = a0; a0 = a1; a1 = tmp; }
    if (a0 > t0) t0 = a0;
    if (a1 < t1) t1 = a1;
  }
  if (Math.abs(qy) < 1e-6) { if (by < lo || by > hiY) return false; }
  else {
    var b0 = (lo - by) / qy, b1 = (hiY - by) / qy;
    if (b0 > b1) { var tmp2 = b0; b0 = b1; b1 = tmp2; }
    if (b0 > t0) t0 = b0;
    if (b1 < t1) t1 = b1;
  }
  if (t1 <= t0) return false;

  var t = t0 + Math.random() * (t1 - t0);
  px[slot] = clamp(bx + qx * t, lo, hiX);
  py[slot] = clamp(by + qy * t, lo, hiY);

  var speed = 2 + Math.random() * 3;
  var drift = (Math.random() - 0.5) * 0.5;
  pvx[slot] = ux * speed + qx * drift;
  pvy[slot] = uy * speed + qy * drift;
  return true;
}
var drainCarry = 0;   // same idea for the drain side
var drainList = [];

function applyWeather() {
  // --- rain: unconditional, so rainRate actually controls rain density ---
  var rate = Math.min(weather.rainRate, CONFIG.rainRateMax);

  // count what is already falling; once the sky is full, hold off
  nRain = 0;
  for (var q = 0; q < nP; q++) if (pTag[q] === 1) nRain++;
  var headroom = CONFIG.rainMaxDrops - nRain;
  if (headroom <= 0) { rate = 0; rainCarry = 0; }

  if (rate > 0) {
    // accumulate fractions so rates below 1 still produce drops — 0.2 means
    // one drop every five frames rather than none at all
    rainCarry += rate;
    var whole = Math.floor(rainCarry);
    rainCarry -= whole;

    var toAdd = Math.min(whole, headroom, maxWater - nP);
    for (var i = 0; i < toAdd; i++) {
      if (nP >= maxP) break;
      if (!spawnRainDrop(nP)) break;
      pTag[nP] = 1;
      nP++;
    }
  }

  // --- drain: proportional controller holding the body at targetP ---
  // Removing exactly what the rain adds would let any error persist forever,
  // so the overshoot term is what actually pins the water level.
  if (targetP <= 0) return;
  var excess = nP - targetP;
  drainCarry += rate * (excess > 0 ? 1 : 0) + excess * CONFIG.drainSpeed;
  if (drainCarry <= 0) { drainCarry = Math.max(drainCarry, -50); return; }

  var toDrain = Math.floor(drainCarry);
  if (toDrain < 1) return;
  drainCarry -= toDrain;

  // one pass to collect candidates sitting on the floor, instead of rescanning
  // the whole array once per removed particle
  drainList.length = 0;
  var floorY = simH - 2.2 - CONFIG.drainBand;
  for (var k = 0; k < nP; k++) {
    if (pTag[k] === 0 && py[k] > floorY) drainList.push(k);
  }

  var removed = 0;
  for (var d = drainList.length - 1; d >= 0 && removed < toDrain; d--) {
    var idx = drainList[d];
    if (idx >= nP) continue;
    nP--;
    if (idx < nP) {
      px[idx] = px[nP]; py[idx] = py[nP];
      pvx[idx] = pvx[nP]; pvy[idx] = pvy[nP];
      pTag[idx] = pTag[nP];
    }
    removed++;
  }
}

// ---- Render ----
var occ = null, fillAlpha = null;

// ---- Glow sprite ----
// Everything on screen is one colour at one brightness, so the whole per-cell
// appearance — block plus halo — bakes into a single sprite, built once and
// stamped per cell. No offscreen passes, no full-screen composite.
// ---- fast path: one baked "block + halo" sprite, stamped once per cell ----
var combo = null, comboSpan = 0, comboScale = 1;

function buildComboSprite() {
  // The sprite has to reach as far as the widest layer, otherwise the ambient
  // wash from `bloomSpread` is simply missing — that was the whole difference
  // people notice when switching off the 'rich' path.
  comboSpan = Math.max(appearance.haloSpread, appearance.bloomSpread, 1.05);
  comboScale = dpr;

  var sizePx = Math.max(8, Math.round(cellW * comboSpan * comboScale));
  combo = document.createElement('canvas');
  combo.width = sizePx; combo.height = sizePx;
  var c = combo.getContext('2d');

  var mid = sizePx * 0.5;
  var rgb = appearance.r + ',' + appearance.g + ',' + appearance.b;
  var k = Math.max(0.2, appearance.falloff);
  var core = clamp(appearance.core, 0, 0.95);

  var wHalo = clamp(appearance.haloMix, 0, 1);
  var wBloom = 1 - wHalo;

  // both layers are concentric falloffs from the same centre, so their
  // weighted sum is just another radial profile — one gradient carries both
  var rHalo = appearance.haloSpread / comboSpan;    // as a fraction of the sprite radius
  var rBloom = appearance.bloomSpread / comboSpan;

  function profile(t, reach) {
    if (reach <= 0) return 0;
    var u = t / reach;
    if (u >= 1) return 0;
    return u <= core ? 1 : Math.pow((1 - u) / (1 - core), k);
  }

  var g = c.createRadialGradient(mid, mid, 0, mid, mid, mid);
  var N = 32;
  var peak = appearance.glow * (appearance.glowBoost || 1);
  for (var i = 0; i <= N; i++) {
    var t = i / N;
    var a = (wHalo * profile(t, rHalo) + wBloom * profile(t, rBloom)) * peak;
    g.addColorStop(t, 'rgba(' + rgb + ',' + Math.min(1, a).toFixed(4) + ')');
  }
  c.fillStyle = g;
  c.fillRect(0, 0, sizePx, sizePx);

  // the block itself, opaque, dead centre
  var bw = blockW / (cellW * comboSpan) * sizePx;
  var bh = blockH / (cellH * comboSpan) * sizePx;
  c.fillStyle = 'rgb(' + rgb + ')';
  c.fillRect(mid - bw * 0.5, mid - bh * 0.5, bw, bh);
}

// Stamped with source-over, not 'lighter'. Everything on screen is the same
// hue, so compositing colour C at any alpha over colour C leaves C untouched —
// blocks stay exactly full-strength even where a neighbour's halo crosses them,
// and two overlapping halo tails brighten the gap without ever exceeding the
// block. No accumulation, no clipping, no hue shift, one pass.
function drawGlowFast() {
  if (!combo) buildComboSprite();

  var span = comboSpan;
  var dw = cellW * span, dh = cellH * span;
  var ox = (cellW - dw) * 0.5, oy = (cellH - dh) * 0.5;

  for (var j = 0; j < simH; j++) {
    for (var i = 0; i < simW; i++) {
      var a = fillAlpha[i + j * simW];
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(combo, i * cellW + ox, j * cellH + oy, dw, dh);
    }
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.fillStyle = CONFIG.bg;
  ctx.fillRect(0, 0, W, H);

  if (!occ || occ.length !== numCells) {
    occ = new Uint16Array(numCells);
    fillAlpha = new Float32Array(numCells);
  } else {
    occ.fill(0);
  }

  // count particles per sim cell — one cell, one block
  for (var p = 0; p < nP; p++) {
    var ci = px[p] | 0, cj = py[p] | 0;
    if (ci >= 0 && ci < simW && cj >= 0 && cj < simH) occ[ci + cj * simW]++;
  }

  // Fill is binary by default: any cell holding water gets the full colour, so
  // the body renders as one flat tone. appearance.surfaceFade > 0 re-introduces
  // a soft edge on thin//surface cells if you want it.
  var rest = particleRestDensity > 0 ? particleRestDensity : 3.0;
  var full = rest * 0.7;
  var fade = appearance.surfaceFade || 0;

  var i, j, idx;
  for (i = 0; i < numCells; i++) {
    var k = occ[i];
    if (k <= 0) { fillAlpha[i] = 0; continue; }
    fillAlpha[i] = fade > 0
      ? (1 - fade) + fade * Math.min(1, k / full)
      : 1;
  }

  // Close pinholes: an empty cell surrounded on 3+ sides by water is water.
  // Cheap dilation pass that removes isolated dark specks without thickening
  // the outer edge of the fluid.
  for (j = 1; j < simH - 1; j++) {
    for (i = 1; i < simW - 1; i++) {
      idx = i + j * simW;
      if (occ[idx] > 0) continue;
      var n = 0, sum = 0;
      if (occ[idx - 1] > 0)    { n++; sum += fillAlpha[idx - 1]; }
      if (occ[idx + 1] > 0)    { n++; sum += fillAlpha[idx + 1]; }
      if (occ[idx - simW] > 0) { n++; sum += fillAlpha[idx - simW]; }
      if (occ[idx + simW] > 0) { n++; sum += fillAlpha[idx + simW]; }
      if (n >= 3) fillAlpha[idx] = sum / n;
    }
  }

  var col = 'rgb(' + appearance.r + ',' + appearance.g + ',' + appearance.b + ')';

  // block sits centred in its cell, leaving an even gap on all four sides
  var offX = (cellW - blockW) * 0.5, offY = (cellH - blockH) * 0.5;

  // one stamp per cell draws the block and its halo together
  drawGlowFast();

  ctx.globalAlpha = 1;

  if (SHOW_STATS) drawStats();
}

var SHOW_STATS = CONFIG.showStats;
try {
  var qp = new URLSearchParams(location.search).get('fps');
  if (qp === '1' || qp === 'true') SHOW_STATS = true;
  if (qp === '0') SHOW_STATS = false;
} catch (e) {}

function stats() {
  return {
    fps: +(1 / frameAvg).toFixed(1),
    msAvg: +(frameAvg * 1000).toFixed(2),
    msWorst: +(frameWorstShown * 1000).toFixed(2),
    quality: +quality.toFixed(2),
    cells: simW * simH,
    grid: simW + 'x' + simH,
    particles: nP,
    drops: nRain,
    pressureIters: numPressureIters,
    particleIters: numParticleIters,
    dpr: dpr,
    sprite: combo ? combo.width : 0,
    span: +comboSpan.toFixed(2)
  };
}
window.rainStats = stats;   // 控制台里随时敲 rainStats()

function drawStats() {
  var st = stats();
  var lines = [
    st.fps + ' fps   ' + st.msAvg + ' ms (peak ' + st.msWorst + ')',
    'quality ' + st.quality.toFixed(2) + '   iters ' + st.pressureIters + '/' + st.particleIters,
    st.grid + ' = ' + st.cells + ' cells   dpr ' + st.dpr,
    st.particles + ' particles   ' + st.drops + ' drops',
    'sprite ' + st.sprite + 'px   span ' + st.span + ' cells'
  ];

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.font = '11px -apple-system, "SF Mono", Menlo, monospace';
  ctx.textBaseline = 'top';

  var pad = 6, lh = 14, top = 8;
  var wMax = 0;
  for (var i = 0; i < lines.length; i++) wMax = Math.max(wMax, ctx.measureText(lines[i]).width);

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(6, top, wMax + pad * 2, lines.length * lh + pad * 2);

  // green while comfortably above target, amber when the governor is cutting back
  ctx.fillStyle = st.fps >= CONFIG.targetFps ? 'rgba(140,220,235,0.95)'
                : st.quality > CONFIG.minQuality ? 'rgba(230,190,120,0.95)'
                : 'rgba(235,140,140,0.95)';
  for (var j = 0; j < lines.length; j++)
    ctx.fillText(lines[j], 6 + pad, top + pad + j * lh);
  ctx.restore();
}

// ---- Frame pacing & automatic quality ----
// Two separate jobs. Pacing keeps the water moving at the right speed even at
// 30fps — with a fixed dt a slow phone plays everything in slow motion. The
// governor then buys frame time back by spending less on the parts that show
// the least: solver iterations first, then the second glow layer.

var lastTs = 0;
var frameAvg = 1 / 60;
var frameWorst = 0;      // slowest frame in the current second
var frameWorstShown = 0;
var statsClock = 0;
var quality = 1;
var qualityCooldown = 0;

function applyQuality() {
  var q = quality;
  numPressureIters = Math.max(8, Math.round(CONFIG.pressureIters * q));
  numParticleIters = Math.max(1, Math.round(CONFIG.particleIters * q));

  // This path is fill-rate bound, not call bound: each stamp covers
  // bloomSpread^2 cells' worth of pixels. Shrinking the ambient reach is the
  // only render lever that actually buys frame time here.
  var span = q < 0.7 ? CONFIG.bloomSpread * 0.55
           : q < 0.9 ? CONFIG.bloomSpread * 0.8
           : CONFIG.bloomSpread;
  span = Math.max(CONFIG.haloSpread, span);
  if (span !== appearance.bloomSpread) {
    appearance.bloomSpread = span;
    if (cellW) buildComboSprite();
  }
}

function governQuality(frameSec) {
  frameAvg += (frameSec - frameAvg) * 0.05;      // slow EMA, ignores single spikes

  // track the worst frame per second separately — an average hides hitches
  if (frameSec > frameWorst) frameWorst = frameSec;
  statsClock += frameSec;
  if (statsClock >= 1) { frameWorstShown = frameWorst; frameWorst = 0; statsClock = 0; }

  if (!CONFIG.autoQuality) return;
  if (qualityCooldown > 0) { qualityCooldown--; return; }

  var fps = 1 / frameAvg;
  var before = quality;

  if (fps < CONFIG.targetFps * 0.95) quality = Math.max(CONFIG.minQuality, quality - 0.15);
  else if (fps > CONFIG.targetFps * 1.15 && quality < 1) quality = Math.min(1, quality + 0.05);

  if (quality !== before) {
    applyQuality();
    qualityCooldown = 45;                        // let it settle before judging again
  }
}

function loop(ts) {
  if (!ts) ts = performance.now();
  var frameSec = lastTs ? (ts - lastTs) / 1000 : 1 / 60;
  lastTs = ts;

  // clamp: below 1/240 the solver gains nothing, above 1/30 FLIP gets unstable.
  // A backgrounded tab returns a huge delta, which the upper clamp absorbs.
  dt = clamp(frameSec, 1 / 240, 1 / 30);

  governQuality(frameSec);

  applyWeather();
  simulate();
  render();
  requestAnimationFrame(loop);
}

resize();
applyQuality();
var rt;
window.addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(resize, 150);
});
// keep the page background in step with CONFIG.bg
document.body.style.background = CONFIG.bg;

loop();
</script>
