<!DOCTYPE html>
<meta charset="utf-8">
<title>雨</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雨">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e17">
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #0a0e17;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
</style>
<canvas id="c"></canvas>
<script>
'use strict';

// ============================================================
//  ⚙  可调参数 — 所有能改画面和手感的东西都在这一块
//     TUNABLES — everything that changes look or feel lives here
// ============================================================

var CONFIG = {

  // ============================================================
  //  固定参数 — 不会被指令改动，只能在这里手改
  //  🔴 标记的是「初始值」，实际运行时读的是下面 LIVE 里的同名字段，
  //     可以被 window.liveConfig.set() 实时覆盖
  // ============================================================

  // ---- 图像 · visual ----
  block: 4,          // 方块边长（CSS 像素）
  gap: 8,            // 方块之间的缝隙
  maxCells: 1410,    // 格子数上限，卡顿就调小
  r: 91, g: 163, b: 181,   // 🔴 水色默认值，默认 #5ba3b5。实时改水色用 LIVE.r/g/b
  bg: '#0a0e17',           // 背景色
  surfaceFade: 0,          // 0 = 颜色完全均匀；0.3-0.5 = 水面边缘柔化
  minParticles: 1,         // 一格里至少几颗粒子才画方块
  rainAlwaysVisible: true, // true = 空中的雨滴不受 minParticles 限制
  showStats: false,        // true = 左上角显示帧率读数，也可用 ?fps=1

  // 光晕：方块和它的光晕一起烘焙进一张精灵，每格盖一次
  glow: 0.99,        // 光晕峰值亮度，占方块颜色的比例。必须 <= 1
  glowBoost: 1.0,    // 整体提亮系数
  haloMix: 0.8,      // 贴身光晕 vs 大范围辉光的配比
  haloSpread: 1.2,   // 贴身光晕的直径，单位是「格」
  bloomSpread: 3.0,  // 弥散辉光的直径，单位是「格」。面积随它平方增长
  core: 0.2,         // 中心平台：半径的这个比例内保持满亮度
  falloff: 2.75,     // 平台之外的衰减曲线

  // ---- 水体 · water body ----
  waterLevel: 0.25,  // 🔴 水面高度，0 = 底部（空），1 = 顶部（满）
  drainSpeed: 0.05,  // 🔴 水位回到目标值的快慢
  drainBand: 3,      // 底部多少格内的水可以被排走
  maxParticles: 12000,     // 粒子总数上限
  particlesPerCell: 9,     // 一格水体由多少颗粒子构成
  flipRatio: 0.95,   // 粒子保留多少自身速度。高 = 各走各的、碎、活；
                     // 低 = 都听网格的、整齐。不产生摩擦，所以调它不会变稠。
                     // 粘性的尝试在 viscosity 分支上。
  pressureIters: 20, // 压力迭代次数，越高水越不可压缩，越贵
  particleIters: 2,  // 粒子互推的迭代次数
  driftK: 1.0,       // 密度补偿强度，防止结块和空洞

  // ---- 潮汐 · tide ----
  // 周期性地旋转重力方向本身（而不是叠加一个额外的侧向力），所以合力大小
  // 永远不变，只有朝向在摆；重力朝下时表现为左右摇，手机侧过来会自动变成
  // 沿着新的水面方向摇
  tideAmplitude: 0.1,  // 🔴 摇摆的最大旋转角度，单位是弧度（不是力的比例）。
                       //   0 = 关闭，0.05-0.3 是明显但不失控的晃动，数值就是
                       //   sin() 摆动的角度振幅，直接决定重力被转开多少
  tidePeriod: 12.0,  // 🔴 一个完整来回的秒数
  tideRainImmune: true,  // true = 下落中的雨滴不受潮汐影响

  // ---- 雨 · rain ----
  // 雨量和水位分开：雨永远按 rainRate 下，水位靠排水自动调节
  rainRate: 0.1,     // 🔴 每帧从顶部落下的雨滴数，可以是小数
  rainRateMax: 10,   // rainRate 的硬上限
  rainMaxDrops: 700, // 空中同时存在的雨滴上限
  rainDiscrete: true,// true = 下落中的雨滴各自独立，不互推、不进网格、不参与压力
  rainImmune: true,  // true = 正在下落的雨滴不受拖拽影响
  rainTerminal: 0,   // 雨滴的终端速度（格/秒），相当于空气阻力。0 = 不限速
  rainImpact: 1,     // 落水瞬间保留多少动量。1 = 全部注入
  rainInitialSpeed: 50, // 沿重力方向的额外初速度。0 = 不加（不再是 LIVE，改了要重新部署）

  // ---- 风 · wind ----
  // 风力做一次缓慢的随机游走，风向恒定平行于陀螺仪测定的重力切线方向（不受
  // 潮汐旋转影响）。雨滴只在生成那一刻采样一次风，之后飞行途中不再受风影响；
  // 落定的水体每帧持续受风推动。
  windMin: 1.0,          // 🔴 风力随机游走的下限
  windMax: 6.0,          // 🔴 风力随机游走的上限
  windChangeSpeed: 0.5,  // 🔴 风力追向新目标的速度，越小越平滑

  // ---- 交互 · interaction ----
  dragStrength: 50,  // 拖拽推水的力度
  dragRadius: 50,    // 拖拽影响的半径，单位是「格」
  dragMaxSpeed: 50,  // 单次拖拽能给出的最大速度
  gravity: 75,       // 重力大小，手机竖直时的满值
  gravityFloor: 0.2, // 手机接近水平时保留的最小重力，占 gravity 的比例
};

// ============================================================
//  LIVE — 可被指令实时改动的子集
//  只有这里列出的字段能通过 window.liveConfig.set() 改；其余一律只读
// ============================================================

var LIVE_RANGES = {
  r: [0, 255], g: [0, 255], b: [0, 255],
  rainRate: [0, 10],
  waterLevel: [0.1, 0.9],
  drainSpeed: [0, 2],
  tideAmplitude: [0, 1],   // 弧度，最多约 57°，防止摇摆角度失控
  tidePeriod: [1.5, 120],  // 太短的周期水根本来不及摆动，视觉上只是抖动
  windMin: [0, 150],
  windMax: [0, 150],
  windChangeSpeed: [0.02, 10],
};

var LIVE = {
  r: CONFIG.r, g: CONFIG.g, b: CONFIG.b,
  rainRate: CONFIG.rainRate,
  waterLevel: CONFIG.waterLevel,
  drainSpeed: CONFIG.drainSpeed,
  tideAmplitude: CONFIG.tideAmplitude,
  tidePeriod: CONFIG.tidePeriod,
  windMin: CONFIG.windMin,
  windMax: CONFIG.windMax,
  windChangeSpeed: CONFIG.windChangeSpeed,
};







// ============================================================
//  以下是实现，一般不需要改
//  Implementation below — you shouldn't need to touch it
// ============================================================

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var BLOCK = CONFIG.block, GAP = CONFIG.gap;
var W, H, PITCH = BLOCK + GAP;
var cellW, cellH, blockW, blockH, dpr = 1;

// ============================================================
// FLIP fluid — following the step order in lib.rs:
//   integrate -> pushApart -> collide -> pushApart -> collide
//   -> transferToGrid -> updateParticleDensity
//   -> solveIncompressibility -> extrapolate -> transferToParticles
// ============================================================

// --- grid ---
var h = 1.0;                 // cell size (sim units)
var simW, simH, numCells;
var u, v, prevU, prevV, wU, wV, s, cellType, particleDensity;
var FLUID = 0, AIR = 1, SOLID = 2;

// --- solver params ---
var dt = 1 / 60;            // rewritten every frame from the real clock
var numPressureIters = CONFIG.pressureIters;
var numParticleIters = CONFIG.particleIters;
var overRelax = 1.9;
var compensateDrift = true;
var driftK = CONFIG.driftK;

// --- particles ---
var maxP = CONFIG.maxParticles;
var nP = 0;
var px = new Float32Array(maxP);
var py = new Float32Array(maxP);
var pvx = new Float32Array(maxP);
var pvy = new Float32Array(maxP);
// 0 = part of the body, 1 = still falling as rain (exempt from drag)
var pTag = new Uint8Array(maxP);

// particle radius is now tied to the seeding spacing (lib.rs: r = 0.3*h, dx = 2r)
// Particle radius sets how many fit in a cell: packing density goes as 1/r^2,
// so r = 0.3h gives the reference 3 per cell and everything scales from there.
var pRadius = 0.3 * h * Math.sqrt(3 / Math.max(1, CONFIG.particlesPerCell));
var minDist = 2.0 * pRadius;
var pInvSpacing = 1.0 / (2.2 * pRadius);
var pNumX, pNumY, pNumCells;
var numCellParticles, firstCellParticle, cellParticleIds;

// rest density is measured once, on the first frame, from the seeded state
var particleRestDensity = 0.0;
var targetP = 0;   // body size the drain regulates towards

// safety clamp only — with the prevU fix this should almost never fire
var MAX_SPEED = 62.5;

function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }

function resize() {
  W = window.innerWidth; H = window.innerHeight;

  // Back the canvas with real device pixels so blocks aren't blurry on phones,
  // and pin the CSS size to the same numbers we drew with, so nothing stretches.
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The sim grid IS the display grid — one simulation cell draws one block.
  // That way every interior cell holds ~restDensity particles and can never
  // come out empty, which is what produced the black speckles.
  simW = Math.max(12, Math.round(W / PITCH));
  simH = Math.max(12, Math.round(H / PITCH));

  // Cap total cells so slower phones keep 60fps; the grid coarsens (blocks and
  // gaps both grow proportionally) rather than dropping frames.
  var MAX_CELLS = CONFIG.maxCells;
  while (simW * simH > MAX_CELLS) {
    simW = Math.max(12, Math.round(simW * 0.94));
    simH = Math.max(12, Math.round(simH * 0.94));
  }

  cellW = W / simW;
  cellH = H / simH;
  blockW = cellW * (BLOCK / PITCH);
  blockH = cellH * (BLOCK / PITCH);

  buildComboSprite();

  initSimBuffers();
}

function initSimBuffers() {
  numCells = simW * simH;
  u = new Float32Array(numCells);
  v = new Float32Array(numCells);
  prevU = new Float32Array(numCells);
  prevV = new Float32Array(numCells);
  wU = new Float32Array(numCells);
  wV = new Float32Array(numCells);
  s = new Float32Array(numCells);
  cellType = new Int32Array(numCells);
  particleDensity = new Float32Array(numCells);

  for (var i = 0; i < simW; i++)
    for (var j = 0; j < simH; j++)
      s[i + j * simW] = (i === 0 || i === simW - 1 || j === 0 || j === simH - 1) ? 0 : 1;

  // counting-sort acceleration grid for pushApart (lib.rs style, zero alloc per frame)
  pNumX = Math.floor(simW * pInvSpacing) + 1;
  pNumY = Math.floor(simH * pInvSpacing) + 1;
  pNumCells = pNumX * pNumY;
  numCellParticles = new Int32Array(pNumCells);
  firstCellParticle = new Int32Array(pNumCells + 1);
  cellParticleIds = new Int32Array(maxP);

  particleRestDensity = 0.0;
  seed();
}

// seed on a staggered lattice with dx = 2r, dy = sqrt(3)/2*dx — this is what
// makes the measured rest density consistent with minDist
function seed() {
  nP = 0;
  var dx = 2.0 * pRadius;
  var dy = Math.sqrt(3.0) / 2.0 * dx;
  var minX = 1.0 + pRadius, maxX = (simW - 1) - pRadius;
  var minY = 1.0 + pRadius, maxY = (simH - 1) - pRadius;
  var startY = minY + (maxY - minY) * (1 - LIVE.waterLevel);

  var row = 0;
  for (var y = startY; y <= maxY; y += dy, row++) {
    for (var x = minX + (row % 2 ? pRadius : 0); x <= maxX; x += dx) {
      if (nP >= maxP - 200) return;   // headroom for touch-added drops
      px[nP] = x; py[nP] = y;
      pvx[nP] = 0; pvy[nP] = 0;
      pTag[nP] = 0;
      nP++;
    }
  }
  // the pool we just laid down IS the target volume the drain aims to hold
  targetP = nP;
}

// Mirrors seed()'s lattice math to count how many particles a given water
// level WOULD hold, without spawning anything. Lets the drain controller
// glide the pool to a new live waterLevel instead of a jarring reseed.
function computeTargetParticles(level) {
  var dx = 2.0 * pRadius;
  var dy = Math.sqrt(3.0) / 2.0 * dx;
  var minX = 1.0 + pRadius, maxX = (simW - 1) - pRadius;
  var minY = 1.0 + pRadius, maxY = (simH - 1) - pRadius;
  var startY = minY + (maxY - minY) * (1 - clamp(level, 0, 1));

  var count = 0, row = 0;
  for (var y = startY; y <= maxY; y += dy, row++) {
    for (var x = minX + (row % 2 ? pRadius : 0); x <= maxX; x += dx) count++;
  }
  return count;
}

var gx = 0, gy = CONFIG.gravity;

// ---- 1. integrate ----
var simTime = 0;
var tideAngle = 0;   // current tide rotation, in radians

// "垂直于重力的方向" 这个量潮汐、风、雨的生成都要用，同一份公式原来分别在
// 三个函数里各写了一遍。现在每帧只算一次，存进 gravTanX/Y 共用。
// "perpendicular to gravity" is needed by tide, wind, and rain spawn — this
// used to be computed independently, with the identical formula, in three
// different functions. Now it's computed once per frame and shared.
var gravTanX = 1, gravTanY = 0;    // unit vector, tangent to gravity
var gravDownX = 0, gravDownY = 1;  // unit vector, along gravity ("down")

function updateGravityBasis() {
  var gLen = Math.sqrt(gx * gx + gy * gy);
  if (gLen < 1e-4) {
    gravTanX = 1; gravTanY = 0;
    gravDownX = 0; gravDownY = 1;
    return;
  }
  gravDownX = gx / gLen;
  gravDownY = gy / gLen;
  gravTanX = -gravDownY;
  gravTanY = gravDownX;
}

// Periodically rotates gravity's direction back and forth by a small angle,
// instead of adding a separate sideways force. tideAmplitude is now read as
// radians of sway (0.1-0.3 is a visible but not disorienting rock).
function updateTide(sdt) {
  simTime += sdt;
  var amp = LIVE.tideAmplitude;
  if (amp <= 0 || LIVE.tidePeriod <= 0) { tideAngle = 0; return; }

  tideAngle = Math.sin(simTime * 2 * Math.PI / LIVE.tidePeriod) * amp;
}

// ---- Wind ----
// A slow random walk on force. Direction is always exactly the gyro-measured
// gravity's tangent (perpendicular to gx,gy) — no independent angle wander,
// and unaffected by the tide rotation applied to particles below. Read once
// per frame by integrateParticles: falling drops freeze whatever vector was
// current at spawn (so a gust doesn't reach back and bend a drop already in
// flight — see spawnRainDrop), landed water gets pushed by the live value
// every frame.
var currentWindForce = (CONFIG.windMin + CONFIG.windMax) * 0.5;
var targetWindForce = currentWindForce;
var currentWindDirX = 1, currentWindDirY = 0;

function updateWind(sdt) {
  // occasionally roll a new target force, chase it smoothly the rest of the time
  if (Math.random() < 0.02) {
    targetWindForce = LIVE.windMin + Math.random() * (LIVE.windMax - LIVE.windMin);
  }
  currentWindForce += (targetWindForce - currentWindForce) *
    clamp(sdt * LIVE.windChangeSpeed * 2, 0, 1);

  currentWindDirX = gravTanX;
  currentWindDirY = gravTanY;
}

function integrateParticles(sdt) {
  var rainSkipsTide = CONFIG.tideRainImmune;
  var term = CONFIG.rainTerminal, term2 = term * term;

  updateWind(sdt);

  var tideCa = Math.cos(tideAngle), tideSa = Math.sin(tideAngle);

  // 全局唯一的一个遍历粒子的 for 循环
  for (var i = 0; i < nP; i++) {
    var isRain = pTag[i] === 1;

    var ax = gx, ay = gy;
    if (!(rainSkipsTide && isRain) && tideAngle !== 0) {
      // rotate gravity itself by the tide angle, rather than adding a
      // separate sideways acceleration — magnitude never changes
      ax = gx * tideCa - gy * tideSa;
      ay = gx * tideSa + gy * tideCa;
    }

    // 表面风力：只吹已经落定、且不在池底保护带内的水体粒子，避免把池底撕开
    if (!isRain) {
      var ci = clamp(Math.floor(px[i]), 0, simW - 1);
      var cj = clamp(Math.floor(py[i]), 0, simH - 1);
      var cellAbove = ci + (cj - 1) * simW;

      if (cj > 0 && cj < simH - 4 && cellType[cellAbove] === AIR) {
         ax += currentWindDirX * currentWindForce * 5.0;
         ay += currentWindDirY * currentWindForce * 5.0;
      }
    }

    pvx[i] += sdt * ax;
    pvy[i] += sdt * ay;

    // Drops are ballistic, so nothing else limits how fast they arrive.
    if (isRain && term > 0) {
      var sp2 = pvx[i] * pvx[i] + pvy[i] * pvy[i];
      if (sp2 > term2) {
        var sc = term / Math.sqrt(sp2);
        pvx[i] *= sc; pvy[i] *= sc;
      }
    }

    px[i] += pvx[i] * sdt;
    py[i] += pvy[i] * sdt;
  }
}

// ---- 2. push apart (counting sort, no per-frame allocation) ----
function pushParticlesApart(numIters) {
  numCellParticles.fill(0);

  var i, xi, yi, cellNr;
  for (i = 0; i < nP; i++) {
    xi = clamp(Math.floor(px[i] * pInvSpacing), 0, pNumX - 1);
    yi = clamp(Math.floor(py[i] * pInvSpacing), 0, pNumY - 1);
    numCellParticles[xi * pNumY + yi]++;
  }

  var first = 0;
  for (i = 0; i < pNumCells; i++) {
    first += numCellParticles[i];
    firstCellParticle[i] = first;
  }
  firstCellParticle[pNumCells] = first;

  for (i = 0; i < nP; i++) {
    xi = clamp(Math.floor(px[i] * pInvSpacing), 0, pNumX - 1);
    yi = clamp(Math.floor(py[i] * pInvSpacing), 0, pNumY - 1);
    cellNr = xi * pNumY + yi;
    firstCellParticle[cellNr]--;
    cellParticleIds[firstCellParticle[cellNr]] = i;
  }

  var minDist2 = minDist * minDist;

  for (var iter = 0; iter < numIters; iter++) {
    for (i = 0; i < nP; i++) {
      var qx0 = px[i], qy0 = py[i];
      var pxi = Math.floor(qx0 * pInvSpacing);
      var pyi = Math.floor(qy0 * pInvSpacing);
      var x0 = Math.max(pxi - 1, 0), y0 = Math.max(pyi - 1, 0);
      var x1 = Math.min(pxi + 1, pNumX - 1), y1 = Math.min(pyi + 1, pNumY - 1);

      for (xi = x0; xi <= x1; xi++) {
        for (yi = y0; yi <= y1; yi++) {
          cellNr = xi * pNumY + yi;
          var f = firstCellParticle[cellNr], l = firstCellParticle[cellNr + 1];
          for (var k = f; k < l; k++) {
            var id = cellParticleIds[k];
            if (id === i) continue;
            // a falling drop neither pushes nor is pushed — that is what keeps
            // the rain from clumping into streaks on the way down
            if (CONFIG.rainDiscrete && (pTag[i] === 1 || pTag[id] === 1)) continue;
            var dx = px[id] - px[i], dy = py[id] - py[i];
            var d2 = dx * dx + dy * dy;
            if (d2 > minDist2 || d2 === 0.0) continue;
            var d = Math.sqrt(d2);
            var sc = 0.5 * (minDist - d) / d;
            dx *= sc; dy *= sc;
            px[i] -= dx; py[i] -= dy;
            px[id] += dx; py[id] += dy;
          }
        }
      }
    }
  }
}

// ---- 3. wall collisions (now its own pass, run after pushApart) ----
function handleParticleCollisions() {
  var minX = h + pRadius, maxX = (simW - 1) * h - pRadius;
  var minY = h + pRadius, maxY = (simH - 1) * h - pRadius;
  for (var i = 0; i < nP; i++) {
    if (px[i] < minX) { px[i] = minX; pvx[i] = 0; }
    else if (px[i] > maxX) { px[i] = maxX; pvx[i] = 0; }
    if (py[i] < minY) { py[i] = minY; pvy[i] = 0; }
    else if (py[i] > maxY) { py[i] = maxY; pvy[i] = 0; }
  }
}

// ---- 4. particles -> grid ----
// u lives on the left face of a cell  -> sampled at (i,     j+0.5)
// v lives on the bottom face of a cell -> sampled at (i+0.5, j)
function transferToGrid() {
  u.fill(0); v.fill(0); wU.fill(0); wV.fill(0);

  var i;
  for (i = 0; i < numCells; i++)
    cellType[i] = (s[i] === 0.0) ? SOLID : AIR;

  for (i = 0; i < nP; i++) {
    if (CONFIG.rainDiscrete && pTag[i] === 1) continue;   // a drop in flight is not fluid yet
    var ci = clamp(Math.floor(px[i]), 0, simW - 1);
    var cj = clamp(Math.floor(py[i]), 0, simH - 1);
    var idx = ci + cj * simW;
    if (cellType[idx] === AIR) cellType[idx] = FLUID;
  }

  for (var p = 0; p < nP; p++) {
    // u component
    var x = px[p], y = py[p] - 0.5;
    var i0 = clamp(Math.floor(x), 0, simW - 2), j0 = clamp(Math.floor(y), 0, simH - 2);
    var fx = clamp(x - i0, 0, 1), fy = clamp(y - j0, 0, 1);
    var w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy),
        w01 = (1 - fx) * fy, w11 = fx * fy;
    var a = i0 + j0 * simW, b = a + 1, c = a + simW, d = c + 1;
    u[a] += w00 * pvx[p]; wU[a] += w00;
    u[b] += w10 * pvx[p]; wU[b] += w10;
    u[c] += w01 * pvx[p]; wU[c] += w01;
    u[d] += w11 * pvx[p]; wU[d] += w11;

    // v component
    x = px[p] - 0.5; y = py[p];
    i0 = clamp(Math.floor(x), 0, simW - 2); j0 = clamp(Math.floor(y), 0, simH - 2);
    fx = clamp(x - i0, 0, 1); fy = clamp(y - j0, 0, 1);
    w00 = (1 - fx) * (1 - fy); w10 = fx * (1 - fy);
    w01 = (1 - fx) * fy; w11 = fx * fy;
    a = i0 + j0 * simW; b = a + 1; c = a + simW; d = c + 1;
    v[a] += w00 * pvy[p]; wV[a] += w00;
    v[b] += w10 * pvy[p]; wV[b] += w10;
    v[c] += w01 * pvy[p]; wV[c] += w01;
    v[d] += w11 * pvy[p]; wV[d] += w11;
  }

  for (i = 0; i < numCells; i++) {
    if (wU[i] > 0) u[i] /= wU[i];
    if (wV[i] > 0) v[i] /= wV[i];
  }

  // enforce solid boundary velocities
  for (var ii = 0; ii < simW; ii++) {
    for (var jj = 0; jj < simH; jj++) {
      var k = ii + jj * simW;
      var isSolid = cellType[k] === SOLID;
      if (isSolid || (ii > 0 && cellType[k - 1] === SOLID)) u[k] = 0;
      if (isSolid || (jj > 0 && cellType[k - simW] === SOLID)) v[k] = 0;
    }
  }
}

// ---- 5. particle density (this is what was missing) ----
function updateParticleDensity() {
  particleDensity.fill(0);
  var h2 = 0.5 * h;

  for (var p = 0; p < nP; p++) {
    // drops in flight must not contribute density, or a cluster of them would
    // read as "body" and retire each other in mid-air
    if (CONFIG.rainDiscrete && pTag[p] === 1) continue;
    var x = clamp(px[p], h, (simW - 1) * h);
    var y = clamp(py[p], h, (simH - 1) * h);

    var x0 = Math.floor((x - h2) / h);
    var tx = ((x - h2) - x0 * h) / h;
    var x1 = Math.min(x0 + 1, simW - 2);
    var y0 = Math.floor((y - h2) / h);
    var ty = ((y - h2) - y0 * h) / h;
    var y1 = Math.min(y0 + 1, simH - 2);

    var sx = 1.0 - tx, sy = 1.0 - ty;
    if (x0 < simW && y0 < simH) particleDensity[x0 + y0 * simW] += sx * sy;
    if (x1 < simW && y0 < simH) particleDensity[x1 + y0 * simW] += tx * sy;
    if (x1 < simW && y1 < simH) particleDensity[x1 + y1 * simW] += tx * ty;
    if (x0 < simW && y1 < simH) particleDensity[x0 + y1 * simW] += sx * ty;
  }

  // measure the rest density once, from the initial (well-packed) state
  if (particleRestDensity === 0.0) {
    var sum = 0, n = 0;
    for (var i = 0; i < numCells; i++) {
      if (cellType[i] === FLUID) { sum += particleDensity[i]; n++; }
    }
    if (n > 0) particleRestDensity = sum / n;
  }
}

// ---- 6. pressure solve ----
// prevU/prevV are snapshotted HERE — the FLIP delta must be
// (after pressure) - (after transfer), within the same frame.
// A rain drop stops counting as rain once it lands in a cell that is already
// carrying roughly body density — at that point it is part of the water and
// should respond to drags like everything else.
function retireLandedRain() {
  if (particleRestDensity <= 0) return;
  var thresh = particleRestDensity * 0.35;
  for (var i = 0; i < nP; i++) {
    if (pTag[i] === 0) continue;
    var ci = px[i] | 0, cj = py[i] | 0;
    if (ci < 0 || ci >= simW || cj < 0 || cj >= simH) continue;
    var idx = ci + cj * simW;

    // joins the body when it lands in water, touches the surface from above,
    // or reaches the floor — without the last two a discrete drop would fall
    // straight through the pool and pile up at the bottom
    var landed =
      particleDensity[idx] >= thresh ||
      cellType[idx] === FLUID ||
      (cj + 1 < simH && cellType[idx + simW] === FLUID) ||
      py[i] > simH - 2.2;

    if (landed) {
      pTag[i] = 0;
      // shed most of the impact momentum as it joins the body
      var d = CONFIG.rainImpact;
      pvx[i] *= d; pvy[i] *= d;
    }
  }
}

function solveIncompressibility() {
  prevU.set(u); prevV.set(v);

  for (var iter = 0; iter < numPressureIters; iter++) {
    for (var i = 1; i < simW - 1; i++) {
      for (var j = 1; j < simH - 1; j++) {
        var center = i + j * simW;
        if (cellType[center] !== FLUID) continue;

        var left = center - 1, right = center + 1;
        var bottom = center - simW, top = center + simW;

        var sx0 = s[left], sx1 = s[right], sy0 = s[bottom], sy1 = s[top];
        var sSum = sx0 + sx1 + sy0 + sy1;
        if (sSum === 0.0) continue;

        var div = u[right] - u[center] + v[top] - v[center];

        if (particleRestDensity > 0.0 && compensateDrift) {
          var compression = particleDensity[center] - particleRestDensity;
          if (compression > 0.0) div -= driftK * compression;
        }

        var p = -div / sSum * overRelax;

        u[center] -= sx0 * p;
        u[right]  += sx1 * p;
        v[center] -= sy0 * p;
        v[top]    += sy1 * p;
      }
    }
  }
}

// ---- 7. extrapolate into air, AFTER the solve ----
// u and prevU are filled from the SAME neighbour set so the FLIP delta
// stays meaningful at the free surface.
function extrapolateVelocities() {
  for (var pass = 0; pass < 2; pass++) {
    for (var i = 1; i < simW - 1; i++) {
      for (var j = 1; j < simH - 1; j++) {
        var idx = i + j * simW;
        if (cellType[idx] === SOLID) continue;

        if (wU[idx] === 0) {
          var su = 0, sp = 0, cnt = 0;
          if (wU[idx - 1] > 0)    { su += u[idx - 1];    sp += prevU[idx - 1];    cnt++; }
          if (wU[idx + 1] > 0)    { su += u[idx + 1];    sp += prevU[idx + 1];    cnt++; }
          if (wU[idx - simW] > 0) { su += u[idx - simW]; sp += prevU[idx - simW]; cnt++; }
          if (wU[idx + simW] > 0) { su += u[idx + simW]; sp += prevU[idx + simW]; cnt++; }
          if (cnt > 0) { u[idx] = su / cnt; prevU[idx] = sp / cnt; wU[idx] = 1; }
        }
        if (wV[idx] === 0) {
          var sv = 0, sq = 0, cnt2 = 0;
          if (wV[idx - 1] > 0)    { sv += v[idx - 1];    sq += prevV[idx - 1];    cnt2++; }
          if (wV[idx + 1] > 0)    { sv += v[idx + 1];    sq += prevV[idx + 1];    cnt2++; }
          if (wV[idx - simW] > 0) { sv += v[idx - simW]; sq += prevV[idx - simW]; cnt2++; }
          if (wV[idx + simW] > 0) { sv += v[idx + simW]; sq += prevV[idx + simW]; cnt2++; }
          if (cnt2 > 0) { v[idx] = sv / cnt2; prevV[idx] = sq / cnt2; wV[idx] = 1; }
        }
      }
    }
  }
}

// ---- 8. grid -> particles ----
function transferToParticles() {
  var maxSp2 = MAX_SPEED * MAX_SPEED;

  for (var p = 0; p < nP; p++) {
    if (CONFIG.rainDiscrete && pTag[p] === 1) continue;   // free fall, no grid feedback
    var x = px[p], y = py[p] - 0.5;
    var i0 = clamp(Math.floor(x), 0, simW - 2), j0 = clamp(Math.floor(y), 0, simH - 2);
    var fx = clamp(x - i0, 0, 1), fy = clamp(y - j0, 0, 1);
    var w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
    var a = i0 + j0 * simW, b = a + 1, c = a + simW, d = c + 1;

    var picU  = w00 * u[a]     + w10 * u[b]     + w01 * u[c]     + w11 * u[d];
    var oldU  = w00 * prevU[a] + w10 * prevU[b] + w01 * prevU[c] + w11 * prevU[d];
    pvx[p] = CONFIG.flipRatio * (pvx[p] + (picU - oldU)) + (1 - CONFIG.flipRatio) * picU;

    x = px[p] - 0.5; y = py[p];
    i0 = clamp(Math.floor(x), 0, simW - 2); j0 = clamp(Math.floor(y), 0, simH - 2);
    fx = clamp(x - i0, 0, 1); fy = clamp(y - j0, 0, 1);
    w00 = (1 - fx) * (1 - fy); w10 = fx * (1 - fy); w01 = (1 - fx) * fy; w11 = fx * fy;
    a = i0 + j0 * simW; b = a + 1; c = a + simW; d = c + 1;

    var picV  = w00 * v[a]     + w10 * v[b]     + w01 * v[c]     + w11 * v[d];
    var oldV  = w00 * prevV[a] + w10 * prevV[b] + w01 * prevV[c] + w11 * prevV[d];
    pvy[p] = CONFIG.flipRatio * (pvy[p] + (picV - oldV)) + (1 - CONFIG.flipRatio) * picV;

    var sp2 = pvx[p] * pvx[p] + pvy[p] * pvy[p];
    if (sp2 > maxSp2) {
      var sc = MAX_SPEED / Math.sqrt(sp2);
      pvx[p] *= sc; pvy[p] *= sc;
    }
  }
}

function simulate() {
  updateTide(dt);
  integrateParticles(dt);
  pushParticlesApart(numParticleIters);
  handleParticleCollisions();
  pushParticlesApart(numParticleIters);
  handleParticleCollisions();
  transferToGrid();
  updateParticleDensity();
  retireLandedRain();
  solveIncompressibility();
  extrapolateVelocities();
  transferToParticles();
}

// ---- Gyroscope ----
// beta/gamma are Euler angles, not screen-space components. Rebuild the actual
// gravity vector from the rotation matrix, then rotate it by the screen's own
// orientation angle — skipping that second step is what made gravity point
// along a diagonal once the phone was turned sideways.

var gyroActive = false;

function screenAngle() {
  if (screen && screen.orientation && typeof screen.orientation.angle === 'number')
    return screen.orientation.angle;
  return window.orientation || 0;   // older iOS
}

function handleOri(e) {
  if (e.beta === null && e.gamma === null) return;

  var beta = (e.beta || 0) * Math.PI / 180;    // front-back tilt
  var gamma = (e.gamma || 0) * Math.PI / 180;  // left-right tilt

  // Gravity in the device's own frame, from the ZXY rotation matrix.
  // Third row of R gives the vertical axis; the in-plane part is what we need.
  var dx = Math.cos(beta) * Math.sin(gamma);   // device X (right)
  var dy = Math.sin(beta);                     // device Y, already flipped to screen-down

  // Now rotate into the *displayed* orientation.
  var th = screenAngle() * Math.PI / 180;
  var ct = Math.cos(th), st = Math.sin(th);
  var sx = dx * ct + dy * st;
  var sy = -dx * st + dy * ct;

  // dx,dy are direction cosines, so their length is the sine of the tilt away
  // from flat: standing upright gives 1, lying on a table gives 0.
  var len = Math.sqrt(sx * sx + sy * sy);
  var floor = CONFIG.gravityFloor;

  if (len < 1e-3) {
    // dead flat and no meaningful direction — keep whatever we had, just weak
    var pl = Math.sqrt(gx * gx + gy * gy) || 1;
    gx = gx / pl * CONFIG.gravity * floor;
    gy = gy / pl * CONFIG.gravity * floor;
    return;
  }

  var mag = Math.max(len, floor) * CONFIG.gravity;
  gx = sx / len * mag;
  gy = sy / len * mag;
}

// No button: lifting a finger doubles as the permission gesture.
// iOS only honours requestPermission() from a click or touchend — touchstart
// does not count, and a preventDefault() before the call voids the activation.
// gyroActive is set only once permission actually lands, so a refusal or a
// mistimed gesture can still be retried on the next lift.
function activateGyro() {
  if (gyroActive) return;

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(function (st) {
      if (st === 'granted') {
        gyroActive = true;
        window.addEventListener('deviceorientation', handleOri);
      }
    }).catch(function () {});
  } else {
    gyroActive = true;
    window.addEventListener('deviceorientation', handleOri);
  }
}

// screenAngle() already reads screen.orientation.angle live on every gyro
// event, so no separate rotation listener is needed — handleOri() self-
// corrects on the very next reading.

// ---- Touch/mouse → momentary impulse on the water ----
// Gravity belongs to the gyroscope alone. A drag no longer tilts the world; it
// shoves the water it passes through, and only while the finger is moving.

var pointerDown = false;
var lastPX = 0, lastPY = 0, hasLast = false;

function stir(sx, sy, dxPx, dyPx) {
  var len = Math.sqrt(dxPx * dxPx + dyPx * dyPx);
  if (len < 0.5) return;                     // a still finger does nothing

  touchDragDist += len;   // relay: only a real drag counts as a "touch event"

  // screen px -> sim cells, and per-frame delta -> velocity
  var cx = sx / W * simW, cy = sy / H * simH;
  var dirX = dxPx / len, dirY = dyPx / len;

  var speed = Math.min(len / cellW * CONFIG.dragStrength * 0.1, CONFIG.dragMaxSpeed);
  var rad = CONFIG.dragRadius, rad2 = rad * rad;

  for (var i = 0; i < nP; i++) {
    if (CONFIG.rainImmune && pTag[i] === 1) continue;   // let the rain fall through
    var ddx = px[i] - cx, ddy = py[i] - cy;
    var d2 = ddx * ddx + ddy * ddy;
    if (d2 > rad2) continue;
    var f = (1 - Math.sqrt(d2) / rad);        // linear falloff from the finger
    pvx[i] += dirX * speed * f;
    pvy[i] += dirY * speed * f;
  }
}

function pointerStart(sx, sy) {
  pointerDown = true;
  lastPX = sx; lastPY = sy; hasLast = true;
  touchDragDist = 0;
  touchReported = false;
}
function pointerMove(sx, sy) {
  if (!pointerDown || !hasLast) return;
  stir(sx, sy, sx - lastPX, sy - lastPY);
  lastPX = sx; lastPY = sy;
}
function pointerEnd() {
  pointerDown = false; hasLast = false;
  reportTouchIfReal();
}

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  pointerStart(e.touches[0].clientX, e.touches[0].clientY);
});
canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  // every finger stirs; the first one also drives lastPX/lastPY
  for (var i = 1; i < e.touches.length; i++) {
    stir(e.touches[i].clientX, e.touches[i].clientY, e.touches[i].clientX - lastPX, e.touches[i].clientY - lastPY);
  }
  pointerMove(e.touches[0].clientX, e.touches[0].clientY);
});
canvas.addEventListener('touchend', function (e) {
  // activateGyro() first, while the touchend user activation is still valid —
  // preventDefault() below would otherwise void it on iOS.
  activateGyro();
  e.preventDefault();
  pointerEnd();
});
canvas.addEventListener('touchcancel', function () { pointerEnd(); });

canvas.addEventListener('mousedown', function (e) { activateGyro(); pointerStart(e.clientX, e.clientY); });
canvas.addEventListener('mousemove', function (e) { pointerMove(e.clientX, e.clientY); });
canvas.addEventListener('mouseup', pointerEnd);
canvas.addEventListener('mouseleave', pointerEnd);

// ---- Weather & appearance ----
var appearance = {
  r: LIVE.r, g: LIVE.g, b: LIVE.b,
  surfaceFade: CONFIG.surfaceFade,
  glow: CONFIG.glow,
  haloMix: CONFIG.haloMix,
  haloSpread: CONFIG.haloSpread,
  bloomSpread: CONFIG.bloomSpread,
  core: CONFIG.core,
  falloff: CONFIG.falloff,
  glowBoost: CONFIG.glowBoost,
};

var maxWater = maxP - 200;  // leave headroom

var nRain = 0;        // drops currently in flight
var rainCarry = 0;    // fractional leftover, so rainRate can be 0.2

// Rain enters from the upwind edge — the side gravity is pulling away from —
// along the line perpendicular to gravity, so turning the phone moves where
// the rain comes from instead of leaving it stuck to one edge of the screen.
function spawnRainDrop(slot) {
  var lo = 1.2, hiX = simW - 1.2, hiY = simH - 1.2;

  // Wind is sampled once, right now, and frozen for this drop's whole flight
  // (integrateParticles never re-adds wind to a falling drop — only gravity
  // does). So the drop's initial velocity IS its flight direction for the
  // entire fall; the spawn band has to be built from that combined vector,
  // not from pure gravity, or strong wind blows the drops sideways out from
  // under a spawn line that never leaned into the wind, leaving a gap on the
  // downwind side.
  var speed = 2 + Math.random() * 3 + CONFIG.rainInitialSpeed;
  var vx0 = gravDownX * speed + currentWindDirX * currentWindForce;
  var vy0 = gravDownY * speed + currentWindDirY * currentWindForce;
  var vLen = Math.sqrt(vx0 * vx0 + vy0 * vy0);

  var ux = gravDownX, uy = gravDownY;   // fallback if velocity is somehow ~0
  if (vLen > 1e-6) { ux = vx0 / vLen; uy = vy0 / vLen; }
  var qx = -uy, qy = ux;                // tangent to the actual flight direction

  var cx = (lo + hiX) * 0.5, cy = (lo + hiY) * 0.5;

  // Full span of the box along the flight-tangent direction. Picking a point
  // here first is the whole trick: the spawn band then hugs both upwind edges
  // at full width. Anchoring on the single most-upwind corner instead
  // produces a short diagonal sliver, which is what rain used to fall from.
  var tMin = Infinity, tMax = -Infinity;
  var xs = [lo, hiX], ys = [lo, hiY];
  for (var a = 0; a < 2; a++) {
    for (var b = 0; b < 2; b++) {
      var t = (xs[a] - cx) * qx + (ys[b] - cy) * qy;
      if (t < tMin) tMin = t;
      if (t > tMax) tMax = t;
    }
  }

  var tt = tMin + Math.random() * (tMax - tMin);
  var ax = cx + qx * tt, ay = cy + qy * tt;

  // walk back up the flight-direction ray from that point to where it enters the box
  var s0 = -1e9, s1 = 1e9;
  if (Math.abs(ux) < 1e-6) { if (ax < lo || ax > hiX) return false; }
  else {
    var e0 = (lo - ax) / ux, e1 = (hiX - ax) / ux;
    if (e0 > e1) { var sw = e0; e0 = e1; e1 = sw; }
    if (e0 > s0) s0 = e0;
    if (e1 < s1) s1 = e1;
  }
  if (Math.abs(uy) < 1e-6) { if (ay < lo || ay > hiY) return false; }
  else {
    var f0 = (lo - ay) / uy, f1 = (hiY - ay) / uy;
    if (f0 > f1) { var sw2 = f0; f0 = f1; f1 = sw2; }
    if (f0 > s0) s0 = f0;
    if (f1 < s1) s1 = f1;
  }
  if (s1 <= s0) return false;

  // spawn exactly at the entry point on the screen edge
  var sp = s0 + 0.05;
  if (sp > s1) sp = s1;

  px[slot] = clamp(ax + ux * sp, lo, hiX);
  py[slot] = clamp(ay + uy * sp, lo, hiY);
  pvx[slot] = vx0;
  pvy[slot] = vy0;
  return true;
}
var drainCarry = 0;   // same idea for the drain side
var drainList = [];

function applyWeather() {
  // --- rain: unconditional, so rainRate actually controls rain density ---
  var rate = Math.min(LIVE.rainRate, CONFIG.rainRateMax);

  // count what is already falling; once the sky is full, hold off
  nRain = 0;
  for (var q = 0; q < nP; q++) if (pTag[q] === 1) nRain++;
  var headroom = CONFIG.rainMaxDrops - nRain;
  if (headroom <= 0) { rate = 0; rainCarry = 0; }

  if (rate > 0) {
    // accumulate fractions so rates below 1 still produce drops — 0.2 means
    // one drop every five frames rather than none at all
    rainCarry += rate;
    var whole = Math.floor(rainCarry);
    rainCarry -= whole;

    var toAdd = Math.min(whole, headroom, maxWater - nP);
    for (var i = 0; i < toAdd; i++) {
      if (nP >= maxP) break;
      if (!spawnRainDrop(nP)) break;
      pTag[nP] = 1;
      nP++;
    }
  }

  // --- drain: proportional controller holding the body at targetP ---
  // Removing exactly what the rain adds would let any error persist forever,
  // so the overshoot term is what actually pins the water level.
  if (targetP <= 0) return;
  var excess = nP - targetP;
  drainCarry += rate * (excess > 0 ? 1 : 0) + excess * LIVE.drainSpeed;
  if (drainCarry <= 0) { drainCarry = Math.max(drainCarry, -50); return; }

  var toDrain = Math.floor(drainCarry);
  if (toDrain < 1) return;
  drainCarry -= toDrain;

  // one pass to collect candidates sitting on the floor, instead of rescanning
  // the whole array once per removed particle
  drainList.length = 0;
  var floorY = simH - 2.2 - CONFIG.drainBand;
  // 设定一个边缘保护区，比如左右各留出 5 格的距离不抽水
  var safeMargin = 5.0;
  for (var k = 0; k < nP; k++) {
    // 只有在底部，且横向坐标不在边缘保护区内的粒子，才会被抽走
    if (pTag[k] === 0 && py[k] > floorY && px[k] > safeMargin && px[k] < simW - safeMargin) {
      drainList.push(k);
    }
  }

  var removed = 0;
  for (var d = drainList.length - 1; d >= 0 && removed < toDrain; d--) {
    var idx = drainList[d];
    if (idx >= nP) continue;
    nP--;
    if (idx < nP) {
      px[idx] = px[nP]; py[idx] = py[nP];
      pvx[idx] = pvx[nP]; pvy[idx] = pvy[nP];
      pTag[idx] = pTag[nP];
    }
    removed++;
  }
}

// ---- Render ----
var occ = null, fillAlpha = null, dropCell = null;

// ---- Glow sprite ----
// Everything on screen is one colour at one brightness, so the whole per-cell
// appearance — block plus halo — bakes into a single sprite, built once and
// stamped per cell. No offscreen passes, no full-screen composite.
// ---- fast path: one baked "block + halo" sprite, stamped once per cell ----
var combo = null, comboSpan = 0, comboScale = 1;

function buildComboSprite() {
  // The sprite has to reach as far as the widest layer, otherwise the ambient
  // wash from `bloomSpread` is simply missing — that was the whole difference
  // people notice when switching off the 'rich' path.
  comboSpan = Math.max(appearance.haloSpread, appearance.bloomSpread, 1.05);
  comboScale = dpr;

  var sizePx = Math.max(8, Math.round(cellW * comboSpan * comboScale));
  combo = document.createElement('canvas');
  combo.width = sizePx; combo.height = sizePx;
  var c = combo.getContext('2d');

  var mid = sizePx * 0.5;
  var rgb = appearance.r + ',' + appearance.g + ',' + appearance.b;
  var k = Math.max(0.2, appearance.falloff);
  var core = clamp(appearance.core, 0, 0.95);

  var wHalo = clamp(appearance.haloMix, 0, 1);
  var wBloom = 1 - wHalo;

  // both layers are concentric falloffs from the same centre, so their
  // weighted sum is just another radial profile — one gradient carries both
  var rHalo = appearance.haloSpread / comboSpan;    // as a fraction of the sprite radius
  var rBloom = appearance.bloomSpread / comboSpan;

  function profile(t, reach) {
    if (reach <= 0) return 0;
    var u = t / reach;
    if (u >= 1) return 0;
    return u <= core ? 1 : Math.pow((1 - u) / (1 - core), k);
  }

  var g = c.createRadialGradient(mid, mid, 0, mid, mid, mid);
  var N = 32;
  var peak = appearance.glow * (appearance.glowBoost || 1);
  for (var i = 0; i <= N; i++) {
    var t = i / N;
    var a = (wHalo * profile(t, rHalo) + wBloom * profile(t, rBloom)) * peak;
    g.addColorStop(t, 'rgba(' + rgb + ',' + Math.min(1, a).toFixed(4) + ')');
  }
  c.fillStyle = g;
  c.fillRect(0, 0, sizePx, sizePx);

  // the block itself, opaque, dead centre
  var bw = blockW / (cellW * comboSpan) * sizePx;
  var bh = blockH / (cellH * comboSpan) * sizePx;
  c.fillStyle = 'rgb(' + rgb + ')';
  c.fillRect(mid - bw * 0.5, mid - bh * 0.5, bw, bh);
}

// Stamped with source-over, not 'lighter'. Everything on screen is the same
// hue, so compositing colour C at any alpha over colour C leaves C untouched —
// blocks stay exactly full-strength even where a neighbour's halo crosses them,
// and two overlapping halo tails brighten the gap without ever exceeding the
// block. No accumulation, no clipping, no hue shift, one pass.
function drawGlowFast() {
  if (!combo) buildComboSprite();

  var span = comboSpan;
  var dw = cellW * span, dh = cellH * span;
  var ox = (cellW - dw) * 0.5, oy = (cellH - dh) * 0.5;

  for (var j = 0; j < simH; j++) {
    for (var i = 0; i < simW; i++) {
      var a = fillAlpha[i + j * simW];
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(combo, i * cellW + ox, j * cellH + oy, dw, dh);
    }
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.fillStyle = CONFIG.bg;
  ctx.fillRect(0, 0, W, H);

  if (!occ || occ.length !== numCells) {
    occ = new Uint16Array(numCells);
    fillAlpha = new Float32Array(numCells);
  } else {
    occ.fill(0);
  }

  // count particles per sim cell — one cell, one block
  // Two counts: total particles per cell, and whether an airborne drop is in
  // it. A drop is a single particle, so any threshold above 1 would erase the
  // rain entirely on its way down unless it's exempt.
  var showRain = CONFIG.rainAlwaysVisible;
  if (showRain) {
    if (!dropCell || dropCell.length !== numCells) dropCell = new Uint8Array(numCells);
    else dropCell.fill(0);
  }

  for (var p = 0; p < nP; p++) {
    var ci = px[p] | 0, cj = py[p] | 0;
    if (ci < 0 || ci >= simW || cj < 0 || cj >= simH) continue;
    var ix = ci + cj * simW;
    occ[ix]++;
    if (showRain && pTag[p] === 1) dropCell[ix] = 1;
  }

  // Fill is binary by default: any cell holding water gets the full colour, so
  // the body renders as one flat tone. appearance.surfaceFade > 0 re-introduces
  // a soft edge on thin//surface cells if you want it.
  var rest = particleRestDensity > 0 ? particleRestDensity : 3.0;
  var full = rest * 0.7;
  var fade = appearance.surfaceFade || 0;

  var minP = Math.max(1, CONFIG.minParticles | 0);

  var i, j, idx;
  for (i = 0; i < numCells; i++) {
    var k = occ[i];
    var visible = k >= minP || (showRain && dropCell[i] === 1);
    if (!visible) { fillAlpha[i] = 0; continue; }
    fillAlpha[i] = fade > 0
      ? (1 - fade) + fade * Math.min(1, k / full)
      : 1;
  }

  // Close pinholes: an empty cell surrounded on 3+ sides by water is water.
  // Cheap dilation pass that removes isolated dark specks without thickening
  // the outer edge of the fluid.
  // 优化：将边界墙壁也视为“天然的水体包围面”，防止角落因为邻居数不足而无法触发补洞
  for (j = 1; j < simH - 1; j++) {
    for (i = 1; i < simW - 1; i++) {
      idx = i + j * simW;
      if (fillAlpha[idx] > 0) continue;

      var n = 0, sum = 0;

      // 左侧：如果是左墙壁 (i === 1)，算作一面墙围着；否则看邻居有没有水
      if (i === 1 || fillAlpha[idx - 1] > 0) {
          n++;
          sum += (i === 1 ? 1 : fillAlpha[idx - 1]);
      }
      // 右侧
      if (i === simW - 2 || fillAlpha[idx + 1] > 0) {
          n++;
          sum += (i === simW - 2 ? 1 : fillAlpha[idx + 1]);
      }
      // 上侧
      if (j === 1 || fillAlpha[idx - simW] > 0) {
          n++;
          sum += (j === 1 ? 1 : fillAlpha[idx - simW]);
      }
      // 下侧：如果是池底 (j === simH - 2)，算作一面墙围着
      if (j === simH - 2 || fillAlpha[idx + simW] > 0) {
          n++;
          sum += (j === simH - 2 ? 1 : fillAlpha[idx + simW]);
      }

      // 现在角落格子天生自带 2 面“实体墙”，只要旁边的流体有一点水，就能达到 n >= 3 的门槛
      if (n >= 3) fillAlpha[idx] = sum / n;
    }
  }

  // one stamp per cell draws the block and its halo together
  // (colour + block/gap offsets are already baked into the sprite by
  // buildComboSprite(), so nothing needs recomputing here every frame)
  drawGlowFast();

  ctx.globalAlpha = 1;

  if (SHOW_STATS) drawStats();
}

var SHOW_STATS = CONFIG.showStats;
try {
  var qp = new URLSearchParams(location.search).get('fps');
  if (qp === '1' || qp === 'true') SHOW_STATS = true;
  if (qp === '0') SHOW_STATS = false;
} catch (e) {}

function stats() {
  return {
    fps: +(1 / frameAvg).toFixed(1),
    msAvg: +(frameAvg * 1000).toFixed(2),
    msWorst: +(frameWorstShown * 1000).toFixed(2),
    simMs: +(simMs).toFixed(2),
    renderMs: +(renderMs).toFixed(2),
    otherMs: +Math.max(0, frameAvg * 1000 - simMs - renderMs).toFixed(2),
    cells: simW * simH,
    grid: simW + 'x' + simH,
    particles: nP,
    drops: nRain,
    pressureIters: numPressureIters,
    particleIters: numParticleIters,
    dpr: dpr,
    sprite: combo ? combo.width : 0,
    span: +comboSpan.toFixed(2)
  };
}
window.rainStats = stats;   // 控制台里随时敲 rainStats()

function drawStats() {
  var st = stats();
  var lines = [
    st.fps + ' fps   ' + st.msAvg + ' ms (peak ' + st.msWorst + ')',
    'sim ' + st.simMs + '   render ' + st.renderMs + '   idle ' + st.otherMs,
    'iters ' + st.pressureIters + '/' + st.particleIters + '   ppc ' + CONFIG.particlesPerCell,
    st.grid + ' = ' + st.cells + ' cells   dpr ' + st.dpr,
    st.particles + ' particles   ' + st.drops + ' drops',
    'sprite ' + st.sprite + 'px   span ' + st.span + ' cells',
    'wind ' + currentWindForce.toFixed(2) + '   dir (' + currentWindDirX.toFixed(2) + ',' + currentWindDirY.toFixed(2) + ')'
  ];

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.font = '11px -apple-system, "SF Mono", Menlo, monospace';
  ctx.textBaseline = 'top';

  var pad = 6, lh = 14, top = 8;
  var wMax = 0;
  for (var i = 0; i < lines.length; i++) wMax = Math.max(wMax, ctx.measureText(lines[i]).width);

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(6, top, wMax + pad * 2, lines.length * lh + pad * 2);

  // green while comfortably above target, amber when the governor is cutting back
  ctx.fillStyle = st.fps >= 50 ? 'rgba(140,220,235,0.95)'
                : st.fps >= 30 ? 'rgba(230,190,120,0.95)'
                : 'rgba(235,140,140,0.95)';
  for (var j = 0; j < lines.length; j++)
    ctx.fillText(lines[j], 6 + pad, top + pad + j * lh);
  ctx.restore();
}

// ---- Frame pacing ----
// Physics time follows the real clock. With a fixed dt a slow phone plays
// everything in slow motion; this keeps the water moving at the right speed
// and just shows fewer frames of it.

var lastTs = 0;
var frameAvg = 1 / 60;
var simMs = 0, renderMs = 0;   // smoothed split of where the frame actually goes
var frameWorst = 0;            // slowest frame in the current second
var frameWorstShown = 0;
var statsClock = 0;

function trackFrame(frameSec) {
  frameAvg += (frameSec - frameAvg) * 0.05;      // slow EMA, ignores single spikes

  // track the worst frame per second separately — an average hides hitches
  if (frameSec > frameWorst) frameWorst = frameSec;
  statsClock += frameSec;
  if (statsClock >= 1) { frameWorstShown = frameWorst; frameWorst = 0; statsClock = 0; }
}

function loop(ts) {
  if (!ts) ts = performance.now();
  var frameSec = lastTs ? (ts - lastTs) / 1000 : 1 / 60;
  lastTs = ts;

  // clamp: below 1/240 the solver gains nothing, above 1/30 FLIP gets unstable.
  // A backgrounded tab returns a huge delta, which the upper clamp absorbs.
  dt = clamp(frameSec, 1 / 240, 1 / 30);

  trackFrame(frameSec);
  updateGravityBasis();   // gx,gy don't change again until the next gyro event
  tickStir();             // a remote stroke, drawn a slice per frame
  tickBlend();            // multi-exposure frame grab, if one is in progress

  // split the frame so it's obvious which half to attack. 'idle' is whatever
  // the browser spends outside our code — compositing, vsync wait, GC.
  var t0 = performance.now();
  applyWeather();
  simulate();
  var t1 = performance.now();
  render();
  var t2 = performance.now();
  simMs += ((t1 - t0) - simMs) * 0.05;
  renderMs += ((t2 - t1) - renderMs) * 0.05;

  requestAnimationFrame(loop);
}

// ============================================================
//  window.liveConfig — AI / 指令改动的唯一入口
//  只有 LIVE_RANGES 里列出的字段能改，其余一律不接受
// ============================================================

function applyLiveSideEffects(key) {
  if (key === 'r' || key === 'g' || key === 'b') {
    appearance.r = LIVE.r; appearance.g = LIVE.g; appearance.b = LIVE.b;
    // 颜色是一次性烘焙进精灵图的，改了要重新烤一次才会生效
    if (cellW) buildComboSprite();
  }
  if (key === 'waterLevel') {
    targetP = Math.min(computeTargetParticles(LIVE.waterLevel), maxWater);
  }
}

window.liveConfig = {
  keys: function () { return Object.keys(LIVE_RANGES); },

  get: function (key) {
    if (key == null) {
      var out = {};
      for (var k in LIVE) out[k] = LIVE[k];
      return out;
    }
    return LIVE[key];
  },

  set: function (key, value) {
    var range = LIVE_RANGES[key];
    if (!range) return { ok: false, error: 'unknown or fixed key: ' + key };
    var v = clamp(+value, range[0], range[1]);
    if (!isFinite(v)) return { ok: false, error: 'not a number' };

    if ((key === 'r' || key === 'g' || key === 'b')) v = Math.round(v);
    if (key === 'windMin' && v > LIVE.windMax) LIVE.windMax = v;
    if (key === 'windMax' && v < LIVE.windMin) LIVE.windMin = v;

    LIVE[key] = v;
    applyLiveSideEffects(key);
    return { ok: true, key: key, value: v };
  },

  setMany: function (obj) {
    var results = {};
    for (var k in obj) results[k] = this.set(k, obj[k]);
    return results;
  },

  reset: function (key) {
    if (key == null) {
      for (var k in LIVE_RANGES) this.set(k, CONFIG[k]);
      return this.get();
    }
    return this.set(key, CONFIG[key]);
  }
};

// ============================================================
//  rain-relay — Cloudflare Worker bridge
//  控制通道：轮询 /control 拉取远程参数
//  触碰通道：只有真实拖拽（累计距离超过阈值）才上报，一次拖拽只报一次
//  快照通道：定时把当前状态写进去，纯被动存储，没人主动去读不会怎样
// ============================================================

var RELAY = 'https://rain-relay.innsuanw.workers.dev';

var touchDragDist = 0;
var TOUCH_MIN_DIST = 40;     // px，累计拖拽距离小于这个不算一次触碰
var touchReported = false;   // 这次拖拽会话是否已经报过了

// Three exposures 80ms apart, averaged into one frame. Still water stays
// sharp; anything moving smears into a short streak — the picture carries a
// little of the motion instead of freezing it dead.
var blendCanvas = null, blendCtx = null;
var FRAME_EXPOSURES = 3;
var FRAME_GAP_FRAMES = 5;   // frames, not ms — on a phone that drops frames,
                            // a ms delay can land twice inside one rendered frame
var blendPending = 0;       // frames left to wait before the next exposure
var blendShot = -1;         // -1 = idle

function uploadFrame() {
  if (blendShot >= 0) return;               // one blend at a time
  if (!blendCanvas) {
    blendCanvas = document.createElement('canvas');
    blendCtx = blendCanvas.getContext('2d');
  }
  if (blendCanvas.width !== canvas.width || blendCanvas.height !== canvas.height) {
    blendCanvas.width = canvas.width;
    blendCanvas.height = canvas.height;
  }
  blendCtx.globalAlpha = 1;
  blendCtx.fillStyle = CONFIG.bg;
  blendCtx.fillRect(0, 0, blendCanvas.width, blendCanvas.height);
  blendShot = 0;
  blendPending = 0;
}

// called once per rendered frame from loop()
function tickBlend() {
  if (blendShot < 0) return;
  if (blendPending > 0) { blendPending--; return; }

  // running average: each new exposure gets weight 1/(n+1)
  blendCtx.globalAlpha = 1 / (blendShot + 1);
  blendCtx.drawImage(canvas, 0, 0);
  blendShot++;

  if (blendShot < FRAME_EXPOSURES) { blendPending = FRAME_GAP_FRAMES; return; }

  blendCtx.globalAlpha = 1;
  var dataUrl = blendCanvas.toDataURL('image/jpeg', 0.85);
  blendShot = -1;
  fetch(RELAY + '/frame', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dataUrl: dataUrl })
  }).catch(function () {});
}

function reportTouchIfReal() {
  if (touchReported || touchDragDist < TOUCH_MIN_DIST) return;
  touchReported = true;
  fetch(RELAY + '/touch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dist: Math.round(touchDragDist) })
  }).catch(function () {});
  // 半秒后自动送一张画面过去，让水动起来之后的样子被看见
  setTimeout(uploadFrame, 500);
}

function pollControl() {
  fetch(RELAY + '/control?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && Object.keys(data).length) window.liveConfig.setMany(data);
    })
    .catch(function () {});
}
setInterval(pollControl, 5000);

// capture: I remotely POST /capture, the page polls, notices the timestamp
// changed, and uploads a canvas snapshot — purely reactive, never spontaneous
var lastCaptureAt = -1;   // same first-poll rule as /stir below
function pollCapture() {
  fetch(RELAY + '/capture?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.at || data.at === lastCaptureAt) return;
      var firstPoll = lastCaptureAt === -1;
      lastCaptureAt = data.at;
      if (firstPoll) return;
      uploadFrame();
    })
    .catch(function () {});
}
setInterval(pollCapture, 5000);

// stir: the other direction of a touch. I POST a stroke, the page notices the
// timestamp changed and draws it across the water over a few frames — the same
// stir() a finger uses, so it lands with the same weight.
// The stored stroke outlives the page. On the very first poll after a load,
// whatever is sitting in KV is history, not an instruction — record it and
// do nothing, or every refresh replays the last stroke a second or two in.
var lastStirAt = -1;
var stirQueue = null;   // {x0,y0,x1,y1,steps,i} in screen px

function pollStir() {
  fetch(RELAY + '/stir?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.at || d.at === lastStirAt) return;
      var firstPoll = lastStirAt === -1;
      lastStirAt = d.at;
      if (firstPoll) return;
      // normalized 0-1 coords so it doesn't matter what screen it lands on
      var x0 = (d.x0 != null ? d.x0 : 0.5) * W, y0 = (d.y0 != null ? d.y0 : 0.5) * H;
      var x1 = (d.x1 != null ? d.x1 : 0.5) * W, y1 = (d.y1 != null ? d.y1 : 0.5) * H;
      stirQueue = { x0: x0, y0: y0, x1: x1, y1: y1, steps: d.steps || 12, i: 0 };
    })
    .catch(function () {});
}
setInterval(pollStir, 5000);

// called once per rendered frame from loop()
function tickStir() {
  if (!stirQueue) return;
  var q = stirQueue;
  var t0 = q.i / q.steps, t1 = (q.i + 1) / q.steps;
  var ax = q.x0 + (q.x1 - q.x0) * t0, ay = q.y0 + (q.y1 - q.y0) * t0;
  var bx = q.x0 + (q.x1 - q.x0) * t1, by = q.y0 + (q.y1 - q.y0) * t1;
  stir(bx, by, bx - ax, by - ay);
  q.i++;
  if (q.i >= q.steps) stirQueue = null;
}

// How broken-up the water is: the fraction of occupied cells that touch at
// least one empty one. Still water is nearly all interior (~0.1); a stirred
// or rained-on body is mostly edge (0.4+). One pass over the display grid.
function roughness() {
  if (!occ) return 0;
  var wet = 0, edge = 0;
  for (var r = 0; r < displayRows; r++) {
    for (var c = 0; c < displayCols; c++) {
      if (!occ[r * displayCols + c]) continue;
      wet++;
      if (c === 0 || c === displayCols - 1 || r === 0 || r === displayRows - 1 ||
          !occ[r * displayCols + c - 1] || !occ[r * displayCols + c + 1] ||
          !occ[(r - 1) * displayCols + c] || !occ[(r + 1) * displayCols + c]) edge++;
    }
  }
  return wet ? edge / wet : 0;
}

// /state — the instrument reading. Numbers only; when I want the picture I
// ask for a frame and look at it myself.
function sendState() {
  var live = window.liveConfig.get();
  fetch(RELAY + '/state', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      rain: live.rainRate,
      // diagnostic: what the screen claims about its own rotation
      ang: screenAngle(),
      otype: (screen && screen.orientation && screen.orientation.type) || '?',
      wh: W + 'x' + H,
      wind: +currentWindForce.toFixed(2),
      tide: +tideAngle.toFixed(3),
      level: +live.waterLevel.toFixed(3),
      rough: +roughness().toFixed(3),
      fps: +(1 / frameAvg).toFixed(1)
    })
  }).catch(function () {});
}
setInterval(sendState, 5 * 60 * 1000);

resize();
var rt;
window.addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(resize, 150);
});
// keep the page background in step with CONFIG.bg
document.body.style.background = CONFIG.bg;

loop();
</script>
